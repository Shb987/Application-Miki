    <script>
      (function() {
        var p = localStorage.getItem("primary");
        if (!p || p.toLowerCase() === "#006666" || p === "#1D5B79") {
          localStorage.setItem("primary", "#C44ECC");
        }
        var s = localStorage.getItem("secondary");
        if (!s || s.toLowerCase() === "#fe6a49" || s === "#468B97") {
          localStorage.setItem("secondary", "#603CD8");
        }
        var savedMode = localStorage.getItem("mode") || localStorage.getItem("dark");
        if (savedMode === "dark-only") {
          document.documentElement.classList.add("dark-only");
          if (document.body) {
            document.body.classList.add("dark-only");
          } else {
            document.addEventListener("DOMContentLoaded", function() {
              if (document.body) document.body.classList.add("dark-only");
            });
          }
        }
      })();
    </script>

        /* Profile Dropdown & Hover Persistence (Slow Pointer Support) */
        .profile-nav.onhover-dropdown {
            position: relative;
        }
        .profile-nav.onhover-dropdown::after {
            content: "";
            position: absolute;
            top: 100%;
            left: -20px;
            right: -20px;
            height: 25px;
            background: transparent;
            pointer-events: none;
            z-index: 10;
        }
        .profile-nav.onhover-dropdown:hover::after,
        .profile-nav.onhover-dropdown.active::after,
        .profile-nav.onhover-dropdown.show::after {
            pointer-events: auto;
        }
        .profile-nav .profile-dropdown {
            top: 50px !important;
            right: 0 !important;
            left: auto !important;
            min-width: 175px !important;
            border-radius: 8px !important;
        }
        .onhover-show-div {
            transition: opacity 0.22s ease-out, visibility 0.22s ease-out, transform 0.22s ease-out !important;
            transition-delay: 0.25s !important;
        }
        .onhover-dropdown:hover .onhover-show-div,
        .onhover-dropdown.active .onhover-show-div,
        .onhover-dropdown.show .onhover-show-div,
        .onhover-show-div.active,
        .onhover-show-div.show {
            transition-delay: 0s !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0px) !important;
            pointer-events: auto !important;
        }
        .profile-dropdown li a {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 14px !important;
            border-radius: 6px !important;
            font-size: 13.5px !important;
            font-weight: 500 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

    <script src="/assets/js/scrollbar/custom.js"></script>
    <!-- Sidebar Scroll Containment: Mouse wheel on sidebar strictly scrolls sidebar only and never leaks to main interface -->
    <script>
        (function() {
            function bindSidebarScrollIsolation() {
                var sidebar = document.querySelector('.sidebar-wrapper');
                if (!sidebar) return;
                
                sidebar.addEventListener('wheel', function(e) {
                    var scrollEl = sidebar.querySelector('.simplebar-content-wrapper') 
                                || document.getElementById('simple-bar')
                                || sidebar.querySelector('.sidebar-links');
                    if (scrollEl) {
                        scrollEl.scrollTop += e.deltaY;
                        // Always stop the wheel event from reaching window / body / main page
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, { passive: false });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bindSidebarScrollIsolation);
            } else {
                bindSidebarScrollIsolation();
            }
        })();
    </script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/sidebar-pin.js"></script>
    <script src="/assets/js/script.js"></script>

    <!-- Apply sidebar permissions BEFORE sidebar-menu.js so hidden items are never rendered -->
    <script>
        (function() {
            const sidebarMapping = {
                "menu-user-management": "User Management",
                "menu-subscriptions": "Subscription Plans & Transactions",
                "menu-schools": "Schools",
                "menu-notifications": "Notifications",
                "menu-games": "Games",
                "menu-explorer": "Explorer",
                "menu-space-explorer": "Explorer",
                "menu-ocean-explorer": "Explorer",
                "menu-plant-explorer": "Explorer",
                "menu-questions": "Questions Base",
                "menu-Exams": "Exams, Textbooks & Syllabus",
                "menu-quiz": "Quizzes",
                "menu-tutorial": "Tutorials",
                "menu-tuition": "Exams, Textbooks & Syllabus",
                "menu-special-days": "Special Days",
                "menu-analytics": "Analytics",
                "menu-social-media": "Social Content & Contributors",
                "menu-roles": "Roles & Permissions",
                "menu-miki-care": "Miki Care"
            };
            try {
                const cached = localStorage.getItem("admin_permissions");
                const isSuperadmin = localStorage.getItem("admin_is_superadmin") === "true";
                if (!isSuperadmin && cached) {
                    const perms = JSON.parse(cached);
                    let css = '';
                    for (const [menuId, moduleName] of Object.entries(sidebarMapping)) {
                        const modulePerms = perms[moduleName] || {};
                        if (!modulePerms.read) {
                            css += `#${menuId} { display: none !important; }\n`;
                        }
                    }
                    if (css) {
                        const style = document.createElement('style');
                        style.id = 'admin-permissions-style';
                        style.innerHTML = css;
                        document.head.appendChild(style);
                    }
                }
            } catch(e) {}
        })();
    </script>

    <!-- Sidebar jquery (runs AFTER permissions are applied) -->
    <script src="/assets/js/sidebar-menu.js"></script>

    <script>
        window.token = localStorage.getItem("admin_token");
        window.API_BASE = window.API_BASE || "{{ API_BASE }}";

        if (!window.token) {
            window.location.replace("/admin-panel/login");
        }

        async function loadAdminProfile() {
            try {
                const res = await fetch(`${API_BASE}/admin-panel/get_details`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    const nameEl = document.getElementById("admin-name");
                    if (nameEl) nameEl.innerText = data.username;
                    
                    // Update top-right header profile name & role
                    const headerNameEl = document.getElementById("header-profile-name");
                    const headerRoleEl = document.getElementById("header-profile-role");
                    if (headerNameEl) headerNameEl.innerText = data.username + " ";
                    if (headerRoleEl) {
                        const displayRole = data.role.charAt(0).toUpperCase() + data.role.slice(1);
                        headerRoleEl.innerText = displayRole;
                    }

                    // Cache permissions in localStorage for next page load (instant apply)
                    localStorage.setItem("admin_permissions", JSON.stringify(data.permissions || {}));
                    localStorage.setItem("admin_is_superadmin", data.is_superadmin ? "true" : "false");
                    
                    // Enforce sidebar item visibility based on permissions
                    applySidebarPermissions(data);
                } else {
                    localStorage.removeItem("admin_token");
                    window.location.replace("/admin-panel/login");
                }
            } catch (err) {
                console.error("Error loading profile:", err);
            }
        }

        function applySidebarPermissions(data) {
            const sidebarMapping = {
                "menu-user-management": "User Management",
                "menu-subscriptions": "Subscription Plans & Transactions",
                "menu-schools": "Schools",
                "menu-notifications": "Notifications",
                "menu-games": "Games",
                "menu-explorer": "Explorer",
                "menu-space-explorer": "Explorer",
                "menu-ocean-explorer": "Explorer",
                "menu-plant-explorer": "Explorer",
                "menu-questions": "Questions Base",
                "menu-Exams": "Exams, Textbooks & Syllabus",
                "menu-quiz": "Quizzes",
                "menu-tutorial": "Tutorials",
                "menu-tuition": "Exams, Textbooks & Syllabus",
                "menu-special-days": "Special Days",
                "menu-analytics": "Analytics",
                "menu-social-media": "Social Content & Contributors",
                "menu-roles": "Roles & Permissions",
                "menu-miki-care": "Miki Care"
            };

            // If superadmin, show everything
            if (data.is_superadmin) {
                return;
            }

            const perms = data.permissions || {};
            let css = '';
            for (const [menuId, moduleName] of Object.entries(sidebarMapping)) {
                const modulePerms = perms[moduleName] || {};
                if (!modulePerms.read) {
                    css += `#${menuId} { display: none !important; }\n`;
                }
            }
            
            if (css) {
                let style = document.getElementById('admin-permissions-style');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'admin-permissions-style';
                    document.head.appendChild(style);
                }
                style.innerHTML = css;
            }
        }

        function logout() {
            localStorage.removeItem("admin_token");
            localStorage.removeItem("admin_permissions");
            localStorage.removeItem("admin_is_superadmin");
            window.location.replace("/admin-panel/login");
        }

        loadAdminProfile();
    </script>

    <!-- Active Sidebar Highlight Synchronization -->
    <script>
        (function() {
            function syncSidebarState() {
                var path = window.location.pathname;
                if (path.indexOf("/admin-panel/user-management-page") !== -1) {
                    var menu = document.getElementById("menu-user-management");
                    if (menu) {
                        menu.classList.add("active");
                        var aTitle = menu.querySelector(".sidebar-link.sidebar-title");
                        if (aTitle) aTitle.classList.add("active");
                        var sub = menu.querySelector(".sidebar-submenu");
                        if (sub) {
                            sub.style.display = "block";
                            var currentTab = new URLSearchParams(window.location.search).get("tab") || "overview";
                            var items = sub.querySelectorAll("li a");
                            items.forEach(function(item) {
                                item.classList.remove("active");
                                if (item.getAttribute("href").indexOf("tab=" + currentTab) !== -1) {
                                    item.classList.add("active");
                                }
                            });
                        }
                    }
                }
            }
            window.highlightActiveSidebar = syncSidebarState;
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', syncSidebarState);
            } else {
                syncSidebarState();
            }
            window.addEventListener('load', syncSidebarState);
        })();
    </script>
