{% extends "base.html" %}

{% block title %}Miki - Games Management{% endblock %}

{% block head %}
<style>
    .game-tab-btn {
        border-radius: 20px;
        font-size: .83rem;
        font-weight: 600;
        padding: 6px 20px;
    }

    .game-tab-btn.active {
        background: #54ba4a;
        color: #fff;
        border-color: #54ba4a;
    }

    .range-badge {
        background: #7366ff22;
        color: #7366ff;
        border-radius: 10px;
        padding: 2px 10px;
        font-size: .74rem;
        font-weight: 600;
    }

    .stat-mini {
        border-radius: 10px;
        padding: 10px 14px;
        font-size: .82rem;
    }

    #toast-gm {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        min-width: 200px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h4>Games Management</h4>
            </div>
            <div class="col-6">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin-panel/dashboard"><svg class="stroke-icon">
                                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
                            </svg></a></li>
                    <li class="breadcrumb-item active">Games</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="d-flex gap-2 mb-4">
        <button class="btn game-tab-btn active" id="tab-wordle" onclick="switchTab('wordle')">🔤 Wordle</button>
        <button class="btn btn-outline-secondary game-tab-btn" id="tab-squares" onclick="switchTab('squares')">🟦
            Squares</button>
    </div>

    <!-- WORDLE PANEL -->
    <div id="panel-wordle">
        <div class="row mb-3" id="wordle-stats-row">
            <div class="col-12">
                <div class="stat-mini bg-light text-muted">Loading stats...</div>
            </div>
        </div>
        <div class="card" style="border-radius:14px;">
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                    <select id="wordle-filter-range" class="form-select"
                        style="max-width:160px;border-radius:8px;font-size:.85rem;" onchange="loadWordle()">
                        <option value="">All Ranges</option>
                        <option value="1-3">Class 1-3</option>
                        <option value="3-5">Class 3-5</option>
                        <option value="6-8">Class 6-8</option>
                        <option value="9-10">Class 9-10</option>
                        <option value="11-12">Class 11-12</option>
                    </select>
                    <input type="text" id="wordle-search" class="form-control"
                        style="max-width:180px;border-radius:8px;font-size:.85rem;" placeholder="Search word..."
                        oninput="loadWordle()">
                    <button class="btn btn-success btn-sm ms-auto" style="border-radius:8px;"
                        onclick="openWordleModal()">+ Add Word</button>
                    <span class="text-muted" id="wordle-count" style="font-size:.82rem;"></span>
                </div>
                <div class="table-responsive" id="wordle-table-wrapper">
                    <div class="text-center py-4">
                        <div class="spinner-border text-success"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SQUARES PANEL -->
    <div id="panel-squares" style="display:none;">
        <div class="row mb-3" id="squares-stats-row">
            <div class="col-12">
                <div class="stat-mini bg-light text-muted">Loading stats...</div>
            </div>
        </div>
        <div class="card" style="border-radius:14px;">
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                    <select id="squares-filter-range" class="form-select"
                        style="max-width:160px;border-radius:8px;font-size:.85rem;" onchange="loadSquares()">
                        <option value="">All Ranges</option>
                        <option value="1-3">Class 1-3</option>
                        <option value="3-5">Class 3-5</option>
                        <option value="6-8">Class 6-8</option>
                        <option value="9-10">Class 9-10</option>
                        <option value="11-12">Class 11-12</option>
                    </select>
                    <button class="btn btn-success btn-sm ms-auto" style="border-radius:8px;"
                        onclick="openSquaresModal()">+ Add Level</button>
                    <span class="text-muted" id="squares-count" style="font-size:.82rem;"></span>
                </div>
                <div class="table-responsive" id="squares-table-wrapper">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal fade" id="wordleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius:16px;">
            <div class="modal-header bg-success text-white" style="border-radius:16px 16px 0 0;">
                <h6 class="modal-title" id="wordle-modal-title">Add Wordle Word</h6><button type="button"
                    class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="wordle-edit-id">
                <div class="mb-3"><label class="form-label">Word *</label><input id="w-word" type="text"
                        class="form-control" style="text-transform:uppercase;"></div>
                <div class="mb-3"><label class="form-label">Hint *</label><input id="w-hint" type="text"
                        class="form-control"></div>
                <div class="mb-3"><label class="form-label">Level *</label><input id="w-level" type="number"
                        class="form-control"></div>
                <div class="mb-3"><label class="form-label">Class Range *</label>
                    <select id="w-range" class="form-select">
                        <option value="">Select...</option>
                        <option value="1-3">Class 1-3</option>
                        <option value="3-5">Class 3-5</option>
                        <option value="6-8">Class 6-8</option>
                        <option value="9-10">Class 9-10</option>
                        <option value="11-12">Class 11-12</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" onclick="saveWord()">Save
                    Word</button></div>
        </div>
    </div>
</div>

<div class="modal fade" id="squaresModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius:16px;">
            <div class="modal-header bg-primary text-white" style="border-radius:16px 16px 0 0;">
                <h6 class="modal-title" id="squares-modal-title">Add Squares Level</h6><button type="button"
                    class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="squares-edit-id">
                <div class="mb-3"><label class="form-label">Level Number *</label><input id="sq-level" type="number"
                        class="form-control"></div>
                <div class="mb-3"><label class="form-label">Class Range *</label>
                    <select id="sq-range" class="form-select">
                        <option value="">Select...</option>
                        <option value="1-3">Class 1-3</option>
                        <option value="3-5">Class 3-5</option>
                        <option value="6-8">Class 6-8</option>
                        <option value="9-10">Class 9-10</option>
                        <option value="11-12">Class 11-12</option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Words (comma-separated) *</label><input id="sq-words"
                        type="text" class="form-control" style="text-transform:uppercase;"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" onclick="saveSquares()">Save
                    Level</button></div>
        </div>
    </div>
</div>

<div id="toast-gm" class="toast align-items-center text-white border-0"
    style="display:none; position: fixed; bottom: 24px; right: 24px; z-index: 9999;">
    <div class="d-flex">
        <div class="toast-body" id="toast-gm-msg"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem("admin_token");
    function switchTab(tab) {
        document.getElementById("panel-wordle").style.display = tab === "wordle" ? "" : "none";
        document.getElementById("panel-squares").style.display = tab === "squares" ? "" : "none";
        document.getElementById("tab-wordle").className = "btn game-tab-btn" + (tab === "wordle" ? " active" : " btn-outline-secondary");
        document.getElementById("tab-squares").className = "btn game-tab-btn" + (tab === "squares" ? " active" : " btn-outline-secondary");
        if (tab === "squares") { loadSquares(); loadSquaresStats(); }
    }

    async function loadWordle() {
        const range = document.getElementById("wordle-filter-range").value, search = document.getElementById("wordle-search").value.trim();
        let url = `${API_BASE}/admin-panel/games/wordle/words?limit=100`;
        if (range) url += `&class_range=${range}`; if (search) url += `&search=${encodeURIComponent(search)}`;
        const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
        const json = await res.json();
        document.getElementById("wordle-count").textContent = `${json.total || 0} words`;
        let html = `<table class="table table-hover table-bordered"><thead class="table-dark"><tr><th>#</th><th>Word</th><th>Hint</th><th>Level</th><th>Class Range</th><th>Actions</th></tr></thead><tbody>`;
        (json.data || []).forEach((w, i) => {
            html += `<tr><td>${i + 1}</td><td><strong>${w.word}</strong></td><td>${w.hint || "—"}</td><td>${w.level}</td><td><span class="range-badge">${w.class_range}</span></td>
            <td><button class="btn btn-sm btn-outline-primary" onclick="editWord('${w.id}','${w.word}','${(w.hint || "").replace(/'/g, "\\'")}',${w.level},'${w.class_range}')">Edit</button>
            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteWord('${w.id}','${w.word}')">Delete</button></td></tr>`;
        });
        document.getElementById("wordle-table-wrapper").innerHTML = html + `</tbody></table>`;
    }

    async function loadWordleStats() {
        const res = await fetch(`${API_BASE}/admin-panel/games/wordle/stats`, { headers: { Authorization: "Bearer " + token } });
        const json = await res.json(); if (!json.data) return;
        const d = json.data, rangeHtml = Object.entries(d.by_class_range || {}).map(([r, c]) => `<span class="me-3"><strong>${r}:</strong> ${c}</span>`).join("");
        document.getElementById("wordle-stats-row").innerHTML = `<div class="col-12"><div class="stat-mini bg-light"><span class="me-4"><strong>Total Words:</strong> ${d.total_words}</span><span class="me-4"><strong>Sessions:</strong> ${d.total_sessions}</span>${rangeHtml}</div></div>`;
    }

    function openWordleModal(id = "", word = "", hint = "", level = "", range = "") {
        document.getElementById("wordle-edit-id").value = id; document.getElementById("w-word").value = word; document.getElementById("w-hint").value = hint;
        document.getElementById("w-level").value = level; document.getElementById("w-range").value = range;
        document.getElementById("wordle-modal-title").innerText = id ? "Edit Word" : "Add Word";
        new bootstrap.Modal(document.getElementById("wordleModal")).show();
    }
    function editWord(id, word, hint, level, range) { openWordleModal(id, word, hint, level, range); }

    async function saveWord() {
        const id = document.getElementById("wordle-edit-id").value;
        const body = { word: document.getElementById("w-word").value.trim(), hint: document.getElementById("w-hint").value.trim(), level: parseInt(document.getElementById("w-level").value), class_range: document.getElementById("w-range").value };
        const res = await fetch(id ? `${API_BASE}/admin-panel/games/wordle/words/${id}` : `${API_BASE}/admin-panel/games/wordle/words`, { method: id ? "PUT" : "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) { bootstrap.Modal.getInstance(document.getElementById("wordleModal")).hide(); loadWordle(); loadWordleStats(); }
    }

    async function deleteWord(id, w) { if (confirm(`Delete "${w}"?`)) { await fetch(`${API_BASE}/admin-panel/games/wordle/words/${id}`, { method: "DELETE", headers: { Authorization: "Bearer " + token } }); loadWordle(); loadWordleStats(); } }

    async function loadSquares() {
        const range = document.getElementById("squares-filter-range").value;
        const res = await fetch(`${API_BASE}/admin-panel/games/squares/levels?limit=100${range ? `&class_range=${range}` : ''}`, { headers: { Authorization: "Bearer " + token } });
        const json = await res.json();
        document.getElementById("squares-count").textContent = `${json.total || 0} levels`;
        let html = `<table class="table table-hover table-bordered"><thead class="table-dark"><tr><th>#</th><th>Level</th><th>Class Range</th><th>Words</th><th>Actions</th></tr></thead><tbody>`;
        (json.data || []).forEach((lv, i) => {
            html += `<tr><td>${i + 1}</td><td>${lv.level}</td><td><span class="range-badge">${lv.class_range}</span></td><td><code>${(lv.words || []).join(", ")}</code></td>
            <td><button class="btn btn-sm btn-outline-primary" onclick="editSquares('${lv.id}',${lv.level},'${lv.class_range}','${(lv.words || []).join(",")}')">Edit</button>
            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteSquares('${lv.id}',${lv.level})">Delete</button></td></tr>`;
        });
        document.getElementById("squares-table-wrapper").innerHTML = html + `</tbody></table>`;
    }

    async function loadSquaresStats() {
        const res = await fetch(`${API_BASE}/admin-panel/games/squares/stats`, { headers: { Authorization: "Bearer " + token } });
        const json = await res.json(); if (!json.data) return;
        const d = json.data, rangeHtml = Object.entries(d.by_class_range || {}).map(([r, c]) => `<span class="me-3"><strong>${r}:</strong> ${c}</span>`).join("");
        document.getElementById("squares-stats-row").innerHTML = `<div class="col-12"><div class="stat-mini bg-light"><span class="me-4"><strong>Total Levels:</strong> ${d.total_levels}</span><span class="me-4"><strong>Sessions:</strong> ${d.total_sessions}</span>${rangeHtml}</div></div>`;
    }

    function openSquaresModal(id = "", lv = "", rg = "", ws = "") {
        document.getElementById("squares-edit-id").value = id; document.getElementById("sq-level").value = lv; document.getElementById("sq-range").value = rg; document.getElementById("sq-words").value = ws;
        new bootstrap.Modal(document.getElementById("squaresModal")).show();
    }
    function editSquares(id, lv, rg, ws) { openSquaresModal(id, lv, rg, ws); }

    async function saveSquares() {
        const id = document.getElementById("squares-edit-id").value;
        const body = { level: parseInt(document.getElementById("sq-level").value), class_range: document.getElementById("sq-range").value, words: document.getElementById("sq-words").value.split(",").map(w => w.trim().toUpperCase()) };
        const res = await fetch(id ? `${API_BASE}/admin-panel/games/squares/levels/${id}` : `${API_BASE}/admin-panel/games/squares/levels`, { method: id ? "PUT" : "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) { bootstrap.Modal.getInstance(document.getElementById("squaresModal")).hide(); loadSquares(); loadSquaresStats(); }
    }

    async function deleteSquares(id, lv) { if (confirm(`Delete level ${lv}?`)) { await fetch(`${API_BASE}/admin-panel/games/squares/levels/${id}`, { method: "DELETE", headers: { Authorization: "Bearer " + token } }); loadSquares(); loadSquaresStats(); } }

    loadWordle(); loadWordleStats();
</script>
{% endblock %}
