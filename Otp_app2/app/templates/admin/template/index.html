{% extends "base.html" %}

{% block title %}Dashboard - Assessment Portal{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="page-title">
    <div class="row">
      <div class="col-6">
        <h4>Default</h4>
      </div>
      <div class="col-6">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">
              <svg class="stroke-icon">
                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
              </svg></a></li>
          <li class="breadcrumb-item">Dashboard</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<!-- Main content area -->
<div class="row">
  <div class="col-sm-12">
    <!-- ✅ Dashboard data container -->
    <div id="data-section" class="card" style="border-radius:12px;">
      <div class="card-body">
        <h5 class="card-title">Dashboard Data</h5>

    <!-- ✅ End dashboard data container -->
  </div>

{% block scripts %}
<script src="/assets/js/chart/apex-chart/apex-chart.js"></script>
<script src="/assets/js/chart/apex-chart/stock-prices.js"></script>
<script src="/assets/js/chart/apex-chart/moment.min.js"></script>
<script src="/assets/js/chart/echart/config.js"></script>
<script src="/assets/js/chart/echart/pie-chart/facePrint.js"></script>
<script src="/assets/js/chart/echart/pie-chart/testHelper.js"></script>
<script src="/assets/js/chart/echart/pie-chart/custom-transition-texture.js"></script>
<script src="/assets/js/chart/echart/data/symbols.js"></script>
<!-- calendar js-->
<script src="/assets/js/datepicker/date-picker/datepicker.js"></script>
<script src="/assets/js/datepicker/date-picker/datepicker.en.js"></script>
<script src="/assets/js/datepicker/date-picker/datepicker.custom.js"></script>
<script src="/assets/js/dashboard/dashboard_3.js"></script>

<script>
  // ==============================
  // UTC → Local Date Formatter
  // ==============================
  function formatDateTimeUTCToLocal(utcString) {
    if (!utcString) return "";
    console.log("DEBUG: Raw Date string from DB =", utcString);
    let dateString = utcString;
    if (typeof dateString === "string") {
      dateString = dateString.replace(" ", "T");
      if (!dateString.includes("Z") && !dateString.includes("+")) {
        dateString += "Z";
      }
    }
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return utcString;
    const localString = date.toLocaleString();
    console.log("DEBUG: Formatted Local Date =", localString);
    return localString;
  }

  // ==============================
  // Student ID extractor
  // ==============================
  function getStudentIds(user) {
    if (Array.isArray(user.student_ids) && user.student_ids.length > 0) {
      return user.student_ids.join(", ");
    }
    if (typeof user.student_id === "string") {
      return user.student_id;
    }
    return "";
  }

  // ==============================
  // Display Table Utility
  // ==============================
  function displayTable(items, title, columns) {
    let html = `
      <div class="card my-3">
        <div class="card-body">
          <h5 class="card-title mb-4">${title} Data</h5>
    `;
    if (items.length === 0) {
      html += `<p class="text-muted">No data available</p>`;
    } else {
      html += `
        <div class="table-responsive">
          <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
              <tr>
      `;
      columns.forEach(col => {
        html += `<th>${col.label}</th>`;
      });
      html += `
              </tr>
            </thead>
            <tbody>
      `;
      items.forEach(item => {
        html += "<tr>";
        columns.forEach(col => {
          let value = "";
          if (col.key === "student") {
            value = getStudentIds(item);
          } else {
            value = item[col.key] ?? "";
          }
          if (typeof col.format === "function") {
            value = col.format(value);
          }
          else if (Array.isArray(value)) {
            value = value.join(", ");
          }
          html += `<td>${value}</td>`;
        });
        html += "</tr>";
      });
      html += `
            </tbody>
          </table>
        </div>
      `;
    }
    html += `
        </div>
      </div>
    `;
    document.getElementById("data-section").innerHTML = html;
  }

  // ✅ Load Students
  async function loadStudents() {
    try {
      const res = await fetch(`${API_BASE}/user/get_students`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.students || [], "Students", [
        { key: "student_id", label: "Student ID" },
        { key: "student_name", label: "Name" },
        { key: "dob", label: "DOB" },
        { key: "student_class", label: "Class" },
        { key: "guardian_name", label: "Guardian" },
        { key: "address", label: "Address" },
        {
          key: "created_at",
          label: "Created At",
          format: formatDateTimeUTCToLocal
        },
        { key: "is_user", label: "Is User" }
      ]);
    } catch (err) {
      console.error("Error loading students:", err);
    }
  }

  // ✅ Load Users
  async function loadUsers() {
    try {
      const res = await fetch(`${API_BASE}/user/get_users`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.users || [], "Users", [
        { key: "mobile_number", label: "Mobile" },
        { key: "usertype", label: "User Type" },
        { key: "student", label: "Student ID(s)" },
        {
          key: "created_at",
          label: "Created At",
          format: formatDateTimeUTCToLocal
        }
      ]);
    } catch (err) {
      console.error("Error loading users:", err);
    }
  }

  // ✅ Load Logins
  async function loadLogins() {
    try {
      const res = await fetch(`${API_BASE}/user/get_logins`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.logins || [], "Logins", [
        { key: "mobile_number", label: "Mobile" },
        { key: "otp", label: "OTP" },
        { key: "usertype", label: "User Type" },
        {
          key: "created_at",
          label: "Created At",
          format: formatDateTimeUTCToLocal
        },
        {
          key: "expiry",
          label: "Expiry",
          format: formatDateTimeUTCToLocal
        }
      ]);
    } catch (err) {
      console.error("Error loading logins:", err);
    }
  }

  function loadTabContent() {
    const params = new URLSearchParams(window.location.search);
    const tabRaw = params.get("tab") || "students";
    const tab = tabRaw.trim().toLowerCase();
    console.log("DEBUG: Tab detected =", tab);
    switch (tab) {
      case "students": loadStudents(); break;
      case "users": loadUsers(); break;
      case "logins": loadLogins(); break;
      default: loadStudents();
    }
  }

  loadTabContent();
</script>
{% endblock %}
