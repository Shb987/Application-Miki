<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Miki admin login page">
  <meta name="keywords" content="admin login, Miki, mentoring intelligents, dashboard">
  <meta name="author" content="Miki">
  <link rel="icon" href="../assets/images/miki_favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../assets/images/miki_favicon.svg" type="image/svg+xml">
  <title>Miki Admin - Login</title>

  <!-- Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="../assets/css/font-awesome.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/icofont.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/themify.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/flag-icon.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/feather-icon.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
  <link id="color" rel="stylesheet" href="../assets/css/color-1.css" media="screen">
  <link rel="stylesheet" type="text/css" href="../assets/css/responsive.css">

  <style>
    .miki-brand-container {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .miki-logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      text-decoration: none !important;
    }

    .miki-logo-icon {
      max-height: 45px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 102, 102, 0.15);
    }

    .miki-logo-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: #006666;
      margin-bottom: 0;
      line-height: 1;
    }

    .login-main h4 {
      font-weight: 600;
      line-height: 1.4;
      font-size: 1.1rem;
      color: #2b2b2b;
      margin-bottom: 5px;
    }

    .login-main p {
      color: #7a7a7a;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <!-- login page start-->
  <div class="container-fluid">
    <div class="row">
      <div class="col-xl-7">
        <img class="bg-img-cover bg-center" src="../assets/images/login/2.jpg" alt="login-page">
      </div>

      <div class="col-xl-5 p-0">
        <div class="login-card login-dark">
          <div>
            <div class="login-main">
              <form class="theme-form" id="login-form">

                <div class="miki-brand-container">
                  <a class="miki-logo-wrapper" href="index.html">
                    <img class="miki-logo-icon" src="../assets/images/logo/miki_logo.png" alt="Miki Logo">
                    <h1 class="miki-logo-text">Miki</h1>
                  </a>
                  <div>
                    <h4>Mentoring Intelligents for key insights</h4>
                    <p>Enter your credentials to access the admin portal</p>
                  </div>
                </div>

                <div class="form-group">
                  <label class="col-form-label">Username / Email</label>
                  <input class="form-control" name="username" required placeholder="admin@miki.com">
                </div>

                <div class="form-group">
                  <label class="col-form-label">Password</label>
                  <div class="form-input position-relative">
                    <input class="form-control" type="password" name="password" required placeholder="*********">
                    <div class="show-hide"><span class="show"></span></div>
                  </div>
                </div>

                <div class="form-group mb-0">
                  <button class="btn btn-primary btn-block w-100" type="submit">Sign in</button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- latest jquery-->
    <script src="/admin-panel/config.js"></script>

    <script src="../assets/js/jquery.min.js"></script>
    <!-- Bootstrap js-->
    <script src="../assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- feather icon js-->
    <script src="../assets/js/icons/feather-icon/feather.min.js"></script>
    <script src="../assets/js/icons/feather-icon/feather-icon.js"></script>
    <!-- config js-->
    <script src="../assets/js/config.js"></script>
    <!-- theme js-->
    <script src="../assets/js/script.js"></script>

    <script>
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = e.target.username.value;
        const password = e.target.password.value;
        console.log("API_BASE =", window.API_BASE);

        try {
          const res = await fetch(`${window.API_BASE}/admin-panel/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          if (!res.ok) {
            const error = await res.json();
            alert("Login failed: " + error.detail);
            return;
          }

          const data = await res.json();

          // ✅ Save the real returned token key
          localStorage.setItem("admin_token", data.access_token);

          // ✅ Redirect to dashboard
          window.location.replace("/admin-panel/user-management-page");
        } catch (err) {
          console.error("Error:", err);
          alert("Something went wrong! Check console.");
        }
      });
    </script>
  </div>
</body>

</html>
