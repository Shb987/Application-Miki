<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Miki admin login page">
  <meta name="keywords" content="admin login, Miki, mentoring intelligents, dashboard">
  <meta name="author" content="Miki">
  <link rel="icon" href="../assets/images/miki_favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../assets/images/miki_favicon.svg" type="image/svg+xml">
  <title>Miki Admin - Login</title>

  <!-- Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="../assets/css/font-awesome.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/icofont.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/themify.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/flag-icon.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/feather-icon.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
  <link id="color" rel="stylesheet" href="../assets/css/color-1.css" media="screen">
  <link rel="stylesheet" type="text/css" href="../assets/css/responsive.css">

  <script>
    (function () {
      var savedMode = localStorage.getItem("mode") || localStorage.getItem("dark");
      if (savedMode === "dark-only") {
        document.documentElement.classList.add("dark-only");
      }
    })();
  </script>

  <style>
    /* Continuous Unified Page Canvas */
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body:not(.dark-only),
    html:not(.dark-only) {
      background: radial-gradient(ellipse 700px 350px at 85% 6%, rgba(216, 180, 254, 0.35) 0%, rgba(243, 232, 255, 0.20) 45%, transparent 75%), #fbfaff !important;
      background-attachment: fixed !important;
      color: #1e293b;
    }

    body.dark-only,
    html.dark-only {
      background: radial-gradient(ellipse 700px 350px at 85% 6%, rgba(147, 51, 234, 0.15) 0%, rgba(96, 60, 216, 0.08) 45%, transparent 75%), #11131e !important;
      background-attachment: fixed !important;
      color: #f1f5f9 !important;
    }

    .miki-brand-container {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .miki-logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      text-decoration: none !important;
    }

    .miki-logo-icon {
      max-height: 45px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(196, 78, 204, 0.2);
    }

    .miki-logo-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #C44ECC, #603CD8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0;
      line-height: 1;
    }

    /* Zero-Background Hero Column (Seamless for Transparent PNG) */
    .login-hero-col {
      min-height: 100vh;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      overflow: hidden;
    }

    .login-hero-container {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-hero-img {
      max-width: 95%;
      max-height: 86vh;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent !important;
      filter: drop-shadow(0 20px 40px rgba(96, 60, 216, 0.15));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .login-hero-img:hover {
      transform: scale(1.015);
    }

    /* Zero-Background Login Column */
    .login-card {
      background: transparent !important;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .login-main {
      width: 100%;
      max-width: 450px;
      padding: 40px;
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    /* Light Mode Login Main */
    body:not(.dark-only) .login-main,
    html:not(.dark-only) .login-main {
      background: #ffffff !important;
      border: 1px solid rgba(0, 0, 0, 0.06) !important;
      box-shadow: 0 20px 45px rgba(96, 60, 216, 0.08) !important;
    }

    body:not(.dark-only) .login-main h4,
    html:not(.dark-only) .login-main h4 {
      color: #1e293b !important;
      font-weight: 600;
      line-height: 1.4;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    body:not(.dark-only) .login-main p,
    html:not(.dark-only) .login-main p {
      color: #64748b !important;
      font-size: 0.95rem;
    }

    body:not(.dark-only) .col-form-label {
      color: #334155 !important;
      font-weight: 500;
    }

    /* Dark Mode Login Main & Typography */
    body.dark-only .login-hero-img,
    html.dark-only .login-hero-img {
      filter: drop-shadow(0 20px 45px rgba(196, 78, 204, 0.22)) !important;
    }

    .login-card,
    .login-card.login-dark,
    body.dark-only .login-card,
    html.dark-only .login-card,
    body.dark-only .login-dark,
    html.dark-only .login-dark {
      background: transparent !important;
      background-color: transparent !important;
    }

    body.dark-only .login-main,
    html.dark-only .login-main {
      background-color: #1a1d28 !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5) !important;
    }

    body.dark-only .login-main h4,
    html.dark-only .login-main h4 {
      color: #ffffff !important;
      font-weight: 600;
      line-height: 1.4;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    body.dark-only .login-main p,
    html.dark-only .login-main p {
      color: #94a3b8 !important;
      font-size: 0.95rem;
    }

    body.dark-only .col-form-label,
    html.dark-only .col-form-label {
      color: #e2e8f0 !important;
      font-weight: 500;
    }

    body.dark-only .login-main .form-control,
    html.dark-only .login-main .form-control {
      background-color: #11131e !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    body.dark-only .login-main .form-control:focus,
    html.dark-only .login-main .form-control:focus {
      background-color: #11131e !important;
      color: #ffffff !important;
      border-color: #c44ecc !important;
      box-shadow: 0 0 0 3px rgba(196, 78, 204, 0.25) !important;
    }

    body.dark-only .login-main .form-control::placeholder,
    html.dark-only .login-main .form-control::placeholder {
      color: #64748b !important;
    }

    body.dark-only .show-hide span,
    html.dark-only .show-hide span {
      color: #c44ecc !important;
    }

    /* Dark/Light Mode Floating Switcher */
    .theme-mode-switch-wrap {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 1050;
    }

    .theme-mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 50px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
    }

    body.dark-only .theme-mode-btn,
    html.dark-only .theme-mode-btn {
      background: rgba(26, 29, 40, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f1f5f9 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
    }

    .theme-mode-btn:hover {
      transform: translateY(-2px);
      border-color: #c44ecc !important;
    }
  </style>
</head>

<body>
  <!-- Dark / Light Mode Toggle Pill -->
  <div class="theme-mode-switch-wrap">
    <button type="button" class="theme-mode-btn" id="login-theme-toggle" aria-label="Toggle theme">
      <i class="fa fa-moon-o" id="theme-toggle-icon"></i>
      <span id="theme-toggle-text">Dark Mode</span>
    </button>
  </div>
  <!-- login page start-->
  <div class="container-fluid p-0">
    <div class="row m-0">
      <div class="col-xl-7 col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-hero-col">
        <div class="login-hero-container">
          <img class="img-fluid login-hero-img" src="/assets/images/Robot%20Leads%20a%20Colourful%20Learning%20Adventure.png" alt="Miki Learning Adventure">
        </div>
      </div>

      <div class="col-xl-5 col-lg-6 col-12 p-0">
        <div class="login-card login-dark">
          <div>
            <div class="login-main">
              <form class="theme-form" id="login-form" novalidate>

                <div class="miki-brand-container">
                  <a class="miki-logo-wrapper" href="index.html">
                    <img class="miki-logo-icon" src="../assets/images/logo/miki_logo.png" alt="Miki Logo">
                    <h1 class="miki-logo-text">Miki</h1>
                  </a>
                  <div>
                    <h4>Mentoring Intelligents for key insights</h4>
                    <p>Enter your credentials to access the admin portal</p>
                  </div>
                </div>

                <!-- Inline Error / Validation Feedback Alert Box -->
                <div id="login-error" class="alert alert-danger font-weight-bold shadow-sm mb-3 d-none" role="alert" style="border-radius: 12px; font-size: 0.88rem; border-left: 4px solid #dc3545;">
                  <i class="fa fa-exclamation-circle me-2"></i>
                  <span id="login-error-text">Invalid username or password.</span>
                </div>

                <div class="form-group mb-3">
                  <label class="col-form-label">Username / Email</label>
                  <input class="form-control" id="username" name="username" placeholder="admin@miki.com" autocomplete="username">
                  <div class="invalid-feedback" id="username-feedback">Please enter your username or email.</div>
                </div>

                <div class="form-group mb-3">
                  <label class="col-form-label">Password</label>
                  <div class="form-input position-relative">
                    <input class="form-control" type="password" id="password" name="password" placeholder="*********" autocomplete="current-password">
                    <div class="show-hide"><span class="show"></span></div>
                  </div>
                  <div class="invalid-feedback" id="password-feedback">Please enter your password.</div>
                </div>

                <div class="form-group mb-0 mt-4">
                  <button class="btn btn-primary btn-block w-100 py-2 fw-bold" id="btn-submit-login" type="submit">Sign in</button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom HTML Pop-up Modal for Login Errors -->
    <div class="modal fade" id="loginErrorModal" tabindex="-1" aria-labelledby="loginErrorModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; background: #ffffff; overflow: hidden;">
          <div class="modal-header border-0 pb-0 text-center flex-column pt-4 position-relative">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background-color: #fee2e2; color: #dc2626;">
              <i class="fa fa-exclamation-triangle" style="font-size: 1.8rem;"></i>
            </div>
            <h5 class="modal-title font-weight-bold text-danger fs-5" id="loginErrorModalTitle">Login Failed</h5>
          </div>
          <div class="modal-body text-center px-4 py-3 text-secondary" style="font-size: 0.95rem;">
            <p id="loginErrorModalBody" class="mb-0 fw-medium text-dark">Invalid credentials. Please check your username and password.</p>
          </div>
          <div class="modal-footer border-0 justify-content-center pb-4 pt-2">
            <button type="button" class="btn btn-danger px-4 rounded-pill font-weight-bold shadow-sm" data-bs-dismiss="modal" style="min-width: 130px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: none;">Try Again</button>
          </div>
        </div>
      </div>
    </div>

    <!-- latest jquery-->
    <script src="/admin-panel/config.js"></script>

    <script src="../assets/js/jquery.min.js"></script>
    <!-- Bootstrap js-->
    <script src="../assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- feather icon js-->
    <script src="../assets/js/icons/feather-icon/feather.min.js"></script>
    <script src="../assets/js/icons/feather-icon/feather-icon.js"></script>
    <!-- config js-->
    <script src="../assets/js/config.js"></script>
    <!-- theme js-->
    <script src="../assets/js/script.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Theme Switcher for Login Page (Smooth toggle between Light and Dark mode)
        const themeToggleBtn = document.getElementById('login-theme-toggle');
        const themeIcon = document.getElementById('theme-toggle-icon');
        const themeText = document.getElementById('theme-toggle-text');

        function updateThemeState(isDark) {
          if (isDark) {
            document.documentElement.classList.add('dark-only');
            document.body.classList.add('dark-only');
            document.body.classList.remove('light');
            if (themeIcon) themeIcon.className = 'fa fa-sun-o';
            if (themeText) themeText.textContent = 'Light Mode';
          } else {
            document.documentElement.classList.remove('dark-only');
            document.body.classList.remove('dark-only');
            document.body.classList.add('light');
            if (themeIcon) themeIcon.className = 'fa fa-moon-o';
            if (themeText) themeText.textContent = 'Dark Mode';
          }
        }

        const currentIsDark = document.documentElement.classList.contains('dark-only') ||
                              document.body.classList.contains('dark-only') ||
                              (localStorage.getItem("mode") || localStorage.getItem("dark")) === "dark-only";
        updateThemeState(currentIsDark);

        if (themeToggleBtn) {
          themeToggleBtn.addEventListener('click', function () {
            const isDarkNow = !document.body.classList.contains('dark-only');
            localStorage.setItem("mode", isDarkNow ? "dark-only" : "light");
            localStorage.setItem("dark", isDarkNow ? "dark-only" : "light");
            updateThemeState(isDarkNow);
          });
        }

        // Show/Hide Password Toggle
        const toggleBtn = document.querySelector('.show-hide');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function() {
            const passwordInput = document.getElementById('password') || document.querySelector('input[name="password"]');
            const showSpan = document.querySelector('.show');
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              showSpan.classList.add('hide');
            } else {
              passwordInput.type = "password";
              showSpan.classList.remove('hide');
            }
          });
        }

        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorAlert = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');

        function showError(msg) {
          if (errorText) errorText.innerText = msg;
          if (errorAlert) {
            errorAlert.classList.remove('d-none');
            errorAlert.style.display = 'block';
          }
          const modalBody = document.getElementById('loginErrorModalBody');
          if (modalBody) modalBody.innerText = msg;
          const modalEl = document.getElementById('loginErrorModal');
          if (modalEl && typeof bootstrap !== 'undefined') {
            const bsModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            bsModal.show();
          }
        }

        function hideError() {
          if (errorAlert) {
            errorAlert.classList.add('d-none');
            errorAlert.style.display = 'none';
          }
          if (usernameInput) usernameInput.classList.remove('is-invalid');
          if (passwordInput) passwordInput.classList.remove('is-invalid');
        }

        // Clear error feedback on input typing
        if (usernameInput) usernameInput.addEventListener('input', hideError);
        if (passwordInput) passwordInput.addEventListener('input', hideError);

        // Explicitly support pressing Enter key on input fields
        [usernameInput, passwordInput].forEach(input => {
          if (input) {
            input.addEventListener('keydown', function(e) {
              if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                performLogin();
              }
            });
          }
        });

        if (loginForm) {
          loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            performLogin();
          });
        }

        async function performLogin() {
          hideError();

          const username = usernameInput ? usernameInput.value.trim() : '';
          const password = passwordInput ? passwordInput.value : '';

          // 1. Validation check for empty credentials
          if (!username || !password) {
            if (!username && usernameInput) usernameInput.classList.add('is-invalid');
            if (!password && passwordInput) passwordInput.classList.add('is-invalid');

            if (!username && !password) {
              showError("Please enter both username and password.");
            } else if (!username) {
              showError("Please enter your username or email.");
            } else {
              showError("Please enter your password.");
            }
            return;
          }

          const btn = document.getElementById('btn-submit-login');
          const origBtnHtml = btn ? btn.innerHTML : '';
          if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Signing in...';
          }

          try {
            const apiBase = window.API_BASE || '';
            const res = await fetch(`${apiBase}/admin-panel/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            if (!res.ok) {
              let errorMsg = "Invalid username or password. Please check your credentials and try again.";
              try {
                const errData = await res.json();
                if (errData && errData.detail) {
                  errorMsg = errData.detail;
                }
              } catch (e) {}

              if (usernameInput) usernameInput.classList.add('is-invalid');
              if (passwordInput) passwordInput.classList.add('is-invalid');
              showError(errorMsg);
              return;
            }

            const data = await res.json();
            if (data && data.access_token) {
              localStorage.setItem("admin_token", data.access_token);
              window.location.replace("/admin-panel/user-management-page");
            } else {
              showError("Authentication failed. No access token returned.");
            }
          } catch (err) {
            console.error("Login error:", err);
            showError("Unable to connect to server. Please try again later.");
          } finally {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = origBtnHtml;
            }
          }
        }
      });
    </script>
  </div>
</body>

</html>
