<!-- manage_schools.html -->
{% extends "base.html" %}

{% block title %}Manage Schools - Miki{% endblock %}

{% block head %}
<style>
  .glass-card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 8px 32px rgba(31,38,135,0.05);
    transition: transform 0.3s ease;
  }
  .glass-card:hover { transform: translateY(-2px); }
  .school-table th { font-size:0.85rem; font-weight:600; }
  .action-btn { 
    border-radius:8px; 
    font-size:0.78rem; 
    padding:6px 12px; 
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .action-btn i {
    margin-right: 4px;
  }
  .status-badge {
    padding: 5px 12px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* Premium Modal Styling */
  .modal-content {
    border: none;
    border-radius: 20px !important;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
  }
  
  .modal-header {
    background: linear-gradient(135deg, #7366ff 0%, #51bbfe 100%) !important;
    padding: 22px 28px !important;
    border-bottom: none;
  }
  
  .modal-header .modal-title {
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: -0.01em;
    color: #fff !important;
  }
  
  .modal-header .btn-close {
    background-color: rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    padding: 8px;
    opacity: 0.9;
    transition: all 0.2s ease;
  }
  
  .modal-header .btn-close:hover {
    background-color: rgba(255, 255, 255, 0.4);
    opacity: 1;
    transform: rotate(90deg);
  }
  
  .modal-body {
    padding: 32px 28px !important;
    background: #fcfcfd;
  }
  
  .form-group-premium {
    margin-bottom: 20px;
  }
  
  .form-group-premium label {
    font-size: 0.75rem;
    font-weight: 800;
    color: #4a5568;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: block;
  }
  
  .input-wrapper-premium {
    position: relative;
  }
  
  .input-wrapper-premium i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 0.95rem;
    transition: color 0.3s ease;
  }
  
  .input-wrapper-premium .form-control,
  .input-wrapper-premium .form-select {
    padding: 11px 16px 11px 42px !important;
    border: 2px solid #e2e8f0;
    border-radius: 12px !important;
    font-size: 0.88rem;
    font-weight: 500;
    color: #2d3748;
    background-color: #fff;
    transition: all 0.3s ease;
    box-shadow: none !important;
  }
  
  .input-wrapper-premium .form-control:focus,
  .input-wrapper-premium .form-select:focus {
    border-color: #7366ff;
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(115, 102, 255, 0.1) !important;
  }
  
  .input-wrapper-premium .form-control:focus + i,
  .input-wrapper-premium .form-select:focus + i {
    color: #7366ff;
  }
  
  .modal-footer {
    padding: 18px 28px !important;
    background-color: #fff;
    border-top: 1px solid #f1f5f9;
    gap: 12px;
  }
  
  .modal-footer .btn {
    padding: 10px 24px;
    font-weight: 700;
    font-size: 0.88rem;
    border-radius: 12px !important;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .modal-footer .btn-outline-secondary {
    border: 2px solid #e2e8f0;
    color: #718096;
    background: #fff;
  }
  
  .modal-footer .btn-outline-secondary:hover {
    background-color: #f7fafc;
    border-color: #cbd5e0;
    color: #4a5568;
    transform: translateY(-1px);
  }
  
  .modal-footer .btn-primary {
    background: linear-gradient(135deg, #7366ff 0%, #51bbfe 100%) !important;
    border: none !important;
    color: #fff !important;
    box-shadow: 0 4px 15px rgba(115, 102, 255, 0.2) !important;
  }
  
  .modal-footer .btn-primary:hover {
    box-shadow: 0 6px 18px rgba(115, 102, 255, 0.3) !important;
    transform: translateY(-1px);
    opacity: 0.95;
  }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="page-title">
    <div class="row">
      <div class="col-6">
        <h4><i class="fa fa-university" style="color:#7366ff; margin-right: 8px;"></i> Schools</h4>
      </div>
    </div>
  </div>

  <div class="card glass-card">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Manage Schools</h5>
        <button class="btn btn-primary btn-sm d-flex align-items-center" onclick="openAddModal()" style="background: linear-gradient(135deg, #7366ff 0%, #51bbfe 100%) !important; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 700; color: #fff; box-shadow: 0 4px 12px rgba(115,102,255,0.25);">
          <i class="fa fa-plus" style="margin-right: 6px;"></i> Add School
        </button>
      </div>

      <div class="table-responsive" id="schools-table-wrapper">
        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="addSchoolModal" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(5px);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addSchoolModalLabel">Add New School</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="schoolForm">
          <div class="row g-2">
            <div class="col-md-6 form-group-premium">
              <label>School Name</label>
              <div class="input-wrapper-premium">
                <input type="text" class="form-control" id="school_name" placeholder="Enter school name..." required />
                <i class="fa fa-university"></i>
              </div>
            </div>
            <div class="col-md-6 form-group-premium">
              <label>Link</label>
              <div class="input-wrapper-premium">
                <input type="url" class="form-control" id="link" placeholder="https://example.com" required />
                <i class="fa fa-globe"></i>
              </div>
            </div>
          </div><!-- /.row g-2 -->
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary text-white" id="saveSchoolBtn">Save</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  const token = window.token || localStorage.getItem('admin_token');
  const API_BASE = window.API_BASE;

  async function loadSchools() {
    const wrapper = document.getElementById('schools-table-wrapper');
    wrapper.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    const res = await fetch(`${API_BASE}/admin-panel/schools`, { headers: { Authorization: 'Bearer ' + token } });
    const json = await res.json();
    if (!json.data || json.data.length === 0) {
      wrapper.innerHTML = '<div class="text-center text-muted py-4">No schools configured.</div>';
      return;
    }
    let html = `<table class="table table-hover table-bordered school-table">
      <thead class="table-dark"><tr>        <th>#</th>
        <th>Name</th>
        <th>Link</th>
        <th>Students</th>
        <th>Created Date</th>
        <th>Actions</th></tr></thead><tbody>`;
    json.data.forEach((s, i) => {
      const statusBadge = s.status === 'inactive' ? 'bg-secondary' : 'bg-success';
      const createdDate = s.created_at ? new Date(s.created_at).toLocaleDateString() : '—';
      html += `<tr>
        <td>${i+1}</td>
        <td>${s.name || ''}</td>
        <td>${s.link ? `<a href="${s.link}" target="_blank">Visit</a>` : ''}</td>
        <td><span class="badge bg-primary text-white rounded-pill px-3">${s.student_count || 0}</span></td>
        <td>${createdDate}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary action-btn me-1" onclick="editSchool('${s._id}')">
            <i class="fa fa-pencil"></i> Edit
          </button>
          <button class="btn btn-sm btn-outline-danger action-btn" onclick="deleteSchool('${s._id}')">
            <i class="fa fa-trash"></i> Delete
          </button>
        </td>
      </tr>`;
    });
    html += `</tbody></table>`;
    wrapper.innerHTML = html;
  }

  function clearForm() {
    document.getElementById('school_name').value = '';
    document.getElementById('link').value = '';
  }

  function openAddModal() {
    clearForm();
    delete window.currentSchoolId;
    document.getElementById('addSchoolModalLabel').innerText = 'Add New School';
    const modalEl = document.getElementById('addSchoolModal');
    let modal = bootstrap.Modal.getInstance(modalEl);
    if (!modal) {
      modal = new bootstrap.Modal(modalEl);
    }
    modal.show();
  }

  document.getElementById('saveSchoolBtn').addEventListener('click', async () => {
    const nameVal = document.getElementById('school_name').value.trim();
    const linkVal = document.getElementById('link').value.trim();
    if (!nameVal || !linkVal) {
      showToast('School Name and Link are required', 'warning');
      return;
    }
    const payload = {
      name: nameVal,
      link: linkVal,
    };
    const method = window.currentSchoolId ? 'PUT' : 'POST';
    const url = window.currentSchoolId
      ? `${API_BASE}/admin-panel/schools/${window.currentSchoolId}`
      : `${API_BASE}/admin-panel/schools`;
    try {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        showToast(window.currentSchoolId ? 'School updated successfully' : 'School created successfully', 'success');
        loadSchools();
        const modalEl = document.getElementById('addSchoolModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        clearForm();
        delete window.currentSchoolId;
      } else {
        const errMsg = data.detail || 'Failed to save school';
        showToast(typeof errMsg === 'string' ? errMsg : JSON.stringify(errMsg), 'danger');
      }
    } catch (err) {
      showToast('Network error: ' + err.message, 'danger');
    }
  });

  function editSchool(id) {
    // fetch single record for pre-fill
    fetch(`${API_BASE}/admin-panel/schools/${id}`, { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.json())
      .then(json => {
        const s = json.data;
          document.getElementById('school_name').value = s.name || '';
          document.getElementById('link').value = s.link || '';
          window.currentSchoolId = id;
        document.getElementById('addSchoolModalLabel').innerText = 'Edit School';
        const modalEl = document.getElementById('addSchoolModal');
        let modal = bootstrap.Modal.getInstance(modalEl);
        if (!modal) {
          modal = new bootstrap.Modal(modalEl);
        }
        modal.show();
      });
  }

  async function deleteSchool(id) {
    if (!confirm('Delete this school?')) return;
    const res = await fetch(`${API_BASE}/admin-panel/schools/${id}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) { showToast('School deleted', 'success'); loadSchools(); }
    else { showToast('Delete failed', 'danger'); }
  }

  function showToast(msg, type='success') {
    const toastEl = document.createElement('div');
    toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
    toastEl.setAttribute('role', 'alert');
    toastEl.style.position = 'fixed';
    toastEl.style.bottom = '24px';
    toastEl.style.right = '24px';
    toastEl.style.zIndex = '9999';
    toastEl.style.borderRadius = '12px';
    toastEl.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div></div>`;
    document.body.appendChild(toastEl);
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
    setTimeout(() => toastEl.remove(), 3500);
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSchools();
  });
</script>
{% endblock %}
