{% extends "base.html" %}

{% block title %}Add Question - Quiz Module{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h4>Add Question</h4>
            </div>
            <div class="col-6">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin-panel/user-management-page"><svg class="stroke-icon">
                                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
                            </svg></a></li>
                    <li class="breadcrumb-item">Quiz Module</li>
                    <li class="breadcrumb-item active">Add Question</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header pb-0">
                    <h5>Question Details</h5>
                </div>
                <div class="card-body">
                    <form id="questionForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Domain <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="domain" required
                                    placeholder="e.g., General Knowledge, Science">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Question Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="questionType" required onchange="toggleOptions()">
                                    <option value="">Select Type</option>
                                    <option value="MCQ">MCQ</option>
                                    <option value="TrueFalse">True/False</option>
                                    <option value="FillInBlank">Fill in the Blank</option>
                                    <option value="PatternRecognition">Pattern Recognition</option>
                                    <option value="LogicalReasoning">Logical Reasoning</option>
                                    <option value="Analogy">Analogy</option>
                                    <option value="Puzzle">Puzzle</option>
                                    <option value="SentenceCorrection">Sentence Correction</option>
                                    <option value="ErrorSpotting">Error Spotting</option>
                                    <option value="Vocabulary">Vocabulary</option>
                                    <option value="PartsOfSpeech">Parts of Speech</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Question Text <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="questionText" rows="3" required
                                    placeholder="Enter your question here"></textarea>
                            </div>
                            <div class="col-12" id="optionsSection" style="display: none;">
                                <label class="form-label">Options <span class="text-danger">*</span></label>
                                <div id="optionsList">
                                    <div class="input-group mb-2"><input type="text" class="form-control option-input"
                                            placeholder="Option 1"><button class="btn btn-outline-danger" type="button"
                                            onclick="removeOption(this)"><i data-feather="x"></i></button></div>
                                    <div class="input-group mb-2"><input type="text" class="form-control option-input"
                                            placeholder="Option 2"><button class="btn btn-outline-danger" type="button"
                                            onclick="removeOption(this)"><i data-feather="x"></i></button></div>
                                </div>
                                <button type="button" class="btn btn-sm btn-secondary" onclick="addOption()"><i
                                        data-feather="plus"></i> Add Option</button>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correct Answer <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="correctAnswer" required
                                    placeholder="Enter the correct answer">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marks <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="marks" value="1" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Class Range <span class="text-danger">*</span></label>
                                <select class="form-select" id="classRange" required>
                                    <option value="">Select Class</option>
                                    <option value="1-3">1-3</option>
                                    <option value="3-5">3-5</option>
                                    <option value="6-8">6-8</option>
                                    <option value="9-10">9-10</option>
                                    <option value="11-12">11-12</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Difficulty Level <span class="text-danger">*</span></label>
                                <select class="form-select" id="difficultyLevel" required>
                                    <option value="">Select Difficulty</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="isActive">
                                    <option value="true">Active</option>
                                    <option value="false">Inactive</option>
                                </select>
                            </div>
                            <div class="col-12"><label class="form-label">Explanation (Optional)</label><textarea
                                    class="form-control" id="explanation" rows="2"></textarea></div>
                            <div class="col-12"><label class="form-label">Hints (Optional)</label><textarea
                                    class="form-control" id="hints" rows="2"></textarea></div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save
                                    Question</button>
                                <a href="/admin-panel/quiz/questions-page" class="btn btn-secondary"><i
                                        data-feather="x"></i> Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem("admin_token");
    function toggleOptions() {
        const type = document.getElementById("questionType").value;
        const section = document.getElementById("optionsSection");
        const withOptions = ['MCQ', 'Analogy', 'PatternRecognition', 'LogicalReasoning', 'Puzzle', 'SentenceCorrection', 'ErrorSpotting', 'Vocabulary', 'PartsOfSpeech'];
        section.style.display = withOptions.includes(type) ? 'block' : 'none';
    }

    function addOption() {
        const list = document.getElementById("optionsList");
        const div = document.createElement('div');
        div.className = 'input-group mb-2';
        div.innerHTML = `<input type="text" class="form-control option-input" placeholder="Option ${list.children.length + 1}"><button class="btn btn-outline-danger" type="button" onclick="removeOption(this)"><i data-feather="x"></i></button>`;
        list.appendChild(div); feather.replace();
    }

    function removeOption(btn) {
        if (document.getElementById("optionsList").children.length > 2) btn.parentElement.remove();
        else alert("At least 2 options required");
    }

    document.getElementById("questionForm").addEventListener("submit", async e => {
        e.preventDefault();
        const type = document.getElementById("questionType").value;
        let options = null;
        if (document.getElementById("optionsSection").style.display !== 'none') {
            options = Array.from(document.querySelectorAll(".option-input")).map(i => i.value.trim()).filter(v => v !== '');
            if (options.length < 2) { alert("Provide at least 2 options"); return; }
        }
        const data = {
            domain: document.getElementById("domain").value.trim(), question_text: document.getElementById("questionText").value.trim(),
            question_type: type, options, correct_answer: document.getElementById("correctAnswer").value.trim(),
            difficulty_level: document.getElementById("difficultyLevel").value, class_range: document.getElementById("classRange").value,
            marks: parseInt(document.getElementById("marks").value), explanation: document.getElementById("explanation").value.trim() || null,
            hints: document.getElementById("hints").value.trim() || null, is_active: document.getElementById("isActive").value === "true"
        };
        try {
            const res = await fetch(`${API_BASE}/admin-panel/quiz/add-question`, {
                method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(data)
            });
            if (res.ok) { alert("Question added!"); window.location.href = "/admin-panel/quiz/questions-page"; }
            else { const r = await res.json(); alert("Error: " + (r.detail || "Failed")); }
        } catch (err) { alert("Error adding question"); }
    });
</script>
{% endblock %}
