<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Special Days Management">
    <link rel="icon" href="/assets/images/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="/assets/images/favicon.png" type="image/x-icon">
    <title>Special Days - Admin Panel</title>
    <!-- Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="/assets/css/font-awesome.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/icofont.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/themify.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/flag-icon.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/feather-icon.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/scrollbar.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/animate.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
    <link id="color" rel="stylesheet" href="/assets/css/color-1.css" media="screen">
    <link rel="stylesheet" type="text/css" href="/assets/css/responsive.css">

    <!-- FullCalendar CSS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <style>
        .fc-event {
            cursor: pointer;
            border: none;
            padding: 4px 8px;
            font-size: 0.85rem;
            border-radius: 4px;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .fc-event:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            z-index: 5;
        }

        /* FORCE FullCalendar - Robust Toolbar Styling */
        .fc .fc-toolbar {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: space-between !important;
            align-items: center !important;
            gap: 10px !important;
        }

        .fc .fc-toolbar-title {
            font-size: 1.5rem !important;
            font-weight: 700;
            color: #2c3e50 !important;
            /* Dark text for visibility */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 !important;
        }

        /* Target ALL FullCalendar Buttons - Base Class & Variants */
        .fc .fc-button {
            background-color: #7366ff !important;
            /* Theme Purple */
            border-color: #7366ff !important;
            color: #ffffff !important;
            opacity: 1 !important;
            visibility: visible !important;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-transform: capitalize;
            font-weight: 600;
            padding: 8px 16px !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            /* Ensure minimum click target */
        }

        /* Ensure specific button types are caught */
        .fc .fc-button-primary,
        .fc .btn-primary,
        .fc button.fc-prev-button,
        .fc button.fc-next-button,
        .fc button.fc-today-button {
            background-color: #7366ff !important;
            border-color: #7366ff !important;
            color: #ffffff !important;
        }

        /* Essential: Force Icons Inside Buttons to be White */
        .fc .fc-button .fc-icon {
            color: #ffffff !important;
            font-size: 1.2em;
            vertical-align: middle;
            display: inline-block;
        }

        /* Hover States */
        .fc .fc-button:hover,
        .fc .fc-button-primary:hover,
        .fc .btn-primary:hover,
        .fc button:hover {
            background-color: #5c4fce !important;
            /* Darker Purple */
            border-color: #5c4fce !important;
            color: #ffffff !important;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2) !important;
            transform: translateY(-1px);
        }

        /* Active/Focus States */
        .fc .fc-button:active,
        .fc .fc-button:focus,
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background-color: #4a3db5 !important;
            border-color: #4a3db5 !important;
            color: #ffffff !important;
            box-shadow: none !important;
        }

        /* Disabled State */
        .fc .fc-button:disabled {
            background-color: #d1d1d1 !important;
            border-color: #d1d1d1 !important;
            opacity: 0.6 !important;
            cursor: not-allowed;
        }

        /* Responsive / Zoom Adjustments */
        @media (max-width: 991px) {

            /* Broader responsive range */
            .fc .fc-toolbar {
                flex-direction: column;
                align-items: center !important;
                gap: 15px !important;
            }

            .fc .fc-toolbar-chunk:first-child {
                order: 2;
                /* Navigation buttons second */
                display: flex;
                gap: 5px;
            }

            .fc .fc-toolbar-chunk:nth-child(2) {
                order: 1;
                /* Title first */
                width: 100%;
                text-align: center;
            }

            .fc .fc-toolbar-chunk:last-child {
                order: 3;
                /* View buttons last */
                display: flex;
                gap: 5px;
            }

            .fc .fc-toolbar-title {
                font-size: 1.2rem !important;
                margin-bottom: 5px !important;
            }

            .fc .fc-button {
                padding: 6px 12px !important;
                font-size: 0.85rem !important;
            }
        }


        .fc-daygrid-day.fc-day-today {
            background-color: rgba(var(--theme-default), 0.08) !important;
        }

        #calendar {
            min-height: 750px;
            font-family: 'Montserrat', sans-serif;
        }

        /* Modal Enhancements */
        .type-select-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            background-color: #f8f9fa;
        }

        .type-select-card:hover {
            background-color: #f1f3f5;
        }

        input[type="radio"]:checked+.type-select-card {
            border-color: var(--theme-default);
            background-color: rgba(var(--theme-default), 0.08);
            /* More visible background */
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            background-color: var(--theme-default);
            color: #fff;
        }

        .modal-title {
            font-weight: 600;
        }

        .btn-close {
            filter: invert(1);
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <!-- loader starts-->
    <div class="loader-wrapper">
        <div class="loader">
            <div class="loader4"></div>
        </div>
    </div>
    <!-- loader ends-->

    <!-- tap on top starts-->
    <div class="tap-top"><i data-feather="chevrons-up"></i></div>
    <!-- tap on tap ends-->

    <!-- page-wrapper Start-->
    <div class="page-wrapper compact-wrapper" id="pageWrapper">
        <!-- Page Header Start-->
        <div class="page-header">
            <div class="header-wrapper row m-0">
                <div class="header-logo-wrapper col-auto p-0">
                    <div class="logo-wrapper">
                        <a href="/admin-panel/dashboard">
                            <img class="img-fluid for-light" src="/assets/images/logo/logo_dark.png" alt="logo-light">
                            <img class="img-fluid for-dark" src="/assets/images/logo/logo.png" alt="logo-dark">
                        </a>
                    </div>
                    <div class="toggle-sidebar">
                        <i class="status_toggle middle sidebar-toggle" data-feather="align-center"></i>
                    </div>
                </div>
                <div class="left-header col-xxl-5 col-xl-6 col-lg-5 col-md-4 col-sm-3 p-0">
                    <div>
                        <a class="toggle-sidebar" href="#"> <i class="iconly-Category icli"> </i></a>
                        <div class="d-flex align-items-center gap-2 ">
                            <h4 class="f-w-600">Special Days Config</h4>
                        </div>
                    </div>
                </div>
                <div class="nav-right col-xxl-7 col-xl-6 col-md-7 col-8 pull-right right-header p-0 ms-auto">
                    <ul class="nav-menus">
                        <li class="profile-nav onhover-dropdown">
                            <div class="media profile-media">
                                <img class="b-r-10" src="/assets/images/dashboard/profile.png" alt="">
                                <div class="media-body d-xxl-block d-none box-col-none">
                                    <div class="d-flex align-items-center gap-2">
                                        <span id="admin-name">Admin</span>
                                        <i class="middle fa fa-angle-down"> </i>
                                    </div>
                                    <p class="mb-0 font-roboto">Admin</p>
                                </div>
                            </div>
                            <ul class="profile-dropdown onhover-show-div">
                                <li><a href="#" onclick="logout()"><i data-feather="log-out"></i><span>Log
                                            Out</span></a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Page Header Ends-->

        <!-- Page Body Start-->
        <div class="page-body-wrapper">
            <!-- Page Sidebar Start-->
            {% include "sidebar.html" %}
            <!-- Page Sidebar Ends-->

            <div class="page-body">
                <div class="container-fluid">
                    <div class="page-title">
                        <div class="row">
                            <div class="col-6">
                                <h4>Calendar Overview</h4>
                            </div>
                            <div class="col-6">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a href="/admin-panel/dashboard">
                                            <svg class="stroke-icon">
                                                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
                                            </svg>
                                        </a>
                                    </li>
                                    <li class="breadcrumb-item active">Special Days</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Container-fluid starts-->
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card">
                                <div class="card-header pb-0 d-flex justify-content-between align-items-center">
                                    <h5>Event Calendar</h5>
                                    <button class="btn btn-primary"
                                        onclick="openModal(null, new Date().toISOString().split('T')[0])">
                                        <i class="fa fa-plus me-2"></i> Add Special Day
                                    </button>
                                </div>
                                <div class="card-body">
                                    <div id="calendar"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Container-fluid Ends-->
            </div>

            <!-- footer start-->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12 footer-copyright text-center">
                            <p class="mb-0">Copyright 2024 © Admin Panel</p>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Enhanced Add/Edit Modal (New Layout) -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"><i class="fa fa-calendar-plus-o me-2"></i> Add Special Day
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="eventForm" class="theme-form">
                        <input type="hidden" id="eventId">

                        <!-- Row 1: Title (Full Width) -->
                        <div class="mb-3">
                            <label class="form-label">Event Title <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-header"></i></span>
                                <input type="text" class="form-control" id="eventTitle" placeholder="e.g. Earth Day"
                                    required>
                            </div>
                        </div>

                        <!-- Row 2: Date & Activity (50-50) -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Date <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-calendar"></i></span>
                                    <input type="date" class="form-control" id="eventDate" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Activity <small class="text-muted">(Optional)</small></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-lightbulb-o"></i></span>
                                    <input type="text" class="form-control" id="eventActivity"
                                        placeholder="e.g. Simple experiment">
                                </div>
                            </div>
                        </div>

                        <!-- Row 3: Description (Full Width) -->
                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="eventDesc" rows="3" required
                                placeholder="Description..."></textarea>
                        </div>

                        <!-- Row 4: Event Type (Full Width Cards) -->
                        <div class="mb-2">
                            <label class="form-label">Event Type</label>
                            <div class="row g-2">
                                <div class="col-3">
                                    <label class="w-100 mb-0">
                                        <input type="radio" name="eventType" value="Event" class="d-none" checked>
                                        <div class="card type-select-card shadow-sm text-center p-2 h-100 mb-0">
                                            <i class="fa fa-calendar-check-o fa-lg text-primary mb-1"></i>
                                            <h6 class="mb-0 small">General</h6>
                                        </div>
                                    </label>
                                </div>
                                <div class="col-3">
                                    <label class="w-100 mb-0">
                                        <input type="radio" name="eventType" value="Holiday" class="d-none">
                                        <div class="card type-select-card shadow-sm text-center p-2 h-100 mb-0">
                                            <i class="fa fa-star fa-lg text-danger mb-1"></i>
                                            <h6 class="mb-0 small">Holiday</h6>
                                        </div>
                                    </label>
                                </div>
                                <div class="col-3">
                                    <label class="w-100 mb-0">
                                        <input type="radio" name="eventType" value="Exam" class="d-none">
                                        <div class="card type-select-card shadow-sm text-center p-2 h-100 mb-0">
                                            <i class="fa fa-pencil-square-o fa-lg text-dark mb-1"></i>
                                            <h6 class="mb-0 small">Exam</h6>
                                        </div>
                                    </label>
                                </div>
                                <div class="col-3">
                                    <label class="w-100 mb-0">
                                        <input type="radio" name="eventType" value="Celebration" class="d-none">
                                        <div class="card type-select-card shadow-sm text-center p-2 h-100 mb-0">
                                            <i class="fa fa-gift fa-lg text-warning mb-1"></i>
                                            <h6 class="mb-0 small">Celebration</h6>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-danger me-auto" id="deleteBtn" style="display: none;"
                        onclick="deleteEvent()">
                        <i class="fa fa-trash me-1"></i> Delete
                    </button>
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary px-4" id="saveBtn" onclick="saveEvent()">
                        <i class="fa fa-save me-1"></i> Save Event
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/admin-panel/config.js"></script>
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/icons/feather-icon/feather.min.js"></script>
    <script src="/assets/js/icons/feather-icon/feather-icon.js"></script>
    <script src="/assets/js/scrollbar/simplebar.js"></script>
    <script src="/assets/js/scrollbar/custom.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/sidebar-menu.js"></script>
    <script src="/assets/js/sidebar-pin.js"></script>
    <script src="/assets/js/script.js"></script>

    <script>
        const token = localStorage.getItem("admin_token");
        const API_BASE = window.API_BASE;
        let mainCalendar;
        let modalInstance;

        if (!token) {
            window.location.replace("/admin-panel/login");
        }

        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            modalInstance = new bootstrap.Modal(document.getElementById('eventModal'));

            // Initialize Main Calendar
            mainCalendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth,listYear'
                },
                themeSystem: 'bootstrap5',
                selectable: true,
                editable: false,
                height: 'auto',
                events: fetchEvents,
                dateClick: function (info) {
                    openModal(null, info.dateStr);
                },
                eventClick: function (info) {
                    openModal(info.event);
                },
                eventContent: function (arg) {
                    let icon = '';
                    switch (arg.event.extendedProps.type) {
                        case 'Holiday': icon = '★'; break;
                        case 'Exam': icon = '📝'; break;
                        case 'Celebration': icon = '🎉'; break;
                        default: icon = '📅';
                    }
                    return {
                        html: `<div class="fc-content text-truncate">
                                <span class="me-1">${icon}</span>
                                <span class="fw-bold">${arg.event.title}</span>
                               </div>`
                    };
                }
            });
            mainCalendar.render();
        });

        async function fetchEvents(info, successCallback, failureCallback) {
            try {
                const res = await fetch(`${API_BASE}/admin-panel/special-days/`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();

                const events = data.map(d => ({
                    id: d.id,
                    title: d.title,
                    start: d.date,
                    extendedProps: {
                        description: d.description,
                        activity: d.activity,
                        type: d.type
                    },
                    backgroundColor: getColorByType(d.type),
                    borderColor: getColorByType(d.type),
                    textColor: d.type === 'Celebration' ? '#333' : '#fff'
                }));
                successCallback(events);
            } catch (err) {
                console.error(err);
                failureCallback(err);
            }
        }

        function getColorByType(type) {
            switch (type) {
                case 'Holiday': return '#ff6b6b';
                case 'Exam': return '#2c3e50';
                case 'Celebration': return '#ffd93b';
                default: return '#7366ff';
            }
        }

        function openModal(event, dateStr) {
            const deleteBtn = document.getElementById('deleteBtn');
            const form = document.getElementById('eventForm');

            // Reset UI
            document.querySelectorAll('input[name="eventType"]').forEach(r => r.checked = false);

            if (event) {
                // Edit Mode
                document.getElementById('modalTitle').innerHTML = '<i class="fa fa-edit me-2"></i> Edit Special Day';
                document.getElementById('eventId').value = event.id;
                document.getElementById('eventDate').value = event.startStr;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDesc').value = event.extendedProps.description;
                document.getElementById('eventActivity').value = event.extendedProps.activity || '';

                const typeRadio = document.querySelector(`input[name="eventType"][value="${event.extendedProps.type}"]`);
                if (typeRadio) typeRadio.checked = true;

                deleteBtn.style.display = 'block';
            } else {
                // Add Mode
                form.reset();
                document.getElementById('modalTitle').innerHTML = '<i class="fa fa-calendar-plus-o me-2"></i> Add Special Day';
                document.getElementById('eventId').value = '';
                // Set default date
                const today = dateStr || new Date().toISOString().split('T')[0];
                document.getElementById('eventDate').value = today;

                document.querySelector(`input[name="eventType"][value="Event"]`).checked = true;
                deleteBtn.style.display = 'none';
            }

            modalInstance.show();
        }

        async function saveEvent() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;

            // Validation
            const title = document.getElementById('eventTitle').value;
            const desc = document.getElementById('eventDesc').value;
            const date = document.getElementById('eventDate').value;

            if (!title || !desc || !date) {
                alert("Please fill in Date, Title and Description");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Saving...';

            const id = document.getElementById('eventId').value;
            const typeVal = document.querySelector('input[name="eventType"]:checked')?.value || 'Event';

            const payload = {
                date: date,
                title: title,
                description: desc,
                activity: document.getElementById('eventActivity').value,
                type: typeVal,
                is_active: true
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/admin-panel/special-days/${id}` : `${API_BASE}/admin-panel/special-days/`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    modalInstance.hide();
                    mainCalendar.refetchEvents();
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.detail || "Failed to save"));
                }
            } catch (e) {
                alert("Request error: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        async function deleteEvent() {
            const id = document.getElementById('eventId').value;
            if (!id || !confirm("Are you sure you want to delete this event?")) return;

            try {
                const res = await fetch(`${API_BASE}/admin-panel/special-days/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (res.ok) {
                    modalInstance.hide();
                    mainCalendar.refetchEvents();
                } else {
                    alert("Failed to delete event");
                }
            } catch (e) {
                alert("Request error: " + e.message);
            }
        }

        function logout() {
            localStorage.removeItem("admin_token");
            window.location.replace("/admin-panel/login");
        }
    </script>
</body>

</html>
