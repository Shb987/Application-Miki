{% extends "base.html" %}

{% block title %}Calendar Overview - Miki Assessment Portal{% endblock %}

{% block head %}
<!-- FullCalendar CSS - Keeping user's version -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

<style>
    .fc-event {
        cursor: pointer;
        border: none;
        padding: 4px 8px;
        font-size: 0.85rem;
        border-radius: 4px;
        transition: all 0.2s;
        margin-bottom: 2px;
    }

    .fc-event:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        z-index: 5;
    }

    .fc .fc-toolbar {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-between !important;
        align-items: center !important;
        gap: 10px !important;
    }

    .fc .fc-toolbar-title {
        font-size: 1.5rem !important;
        font-weight: 700;
        color: #2c3e50 !important;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0 !important;
    }

    .fc .fc-button {
        background: linear-gradient(135deg, #56dfdf 0%, #19a1a1 100%) !important;
        border: none !important;
        color: #ffffff !important;
        opacity: 1 !important;
        visibility: visible !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-transform: capitalize;
        font-weight: 600;
        padding: 8px 16px !important;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        min-width: 40px;
    }

    .fc .fc-button-primary,
    .fc .btn-primary,
    .fc button.fc-prev-button,
    .fc button.fc-next-button,
    .fc button.fc-today-button {
        background: linear-gradient(135deg, #56dfdf 0%, #19a1a1 100%) !important;
        border: none !important;
        color: #ffffff !important;
    }

    .fc .fc-button .fc-icon {
        color: #ffffff !important;
        font-size: 1.2em;
        vertical-align: middle;
        display: inline-block;
    }

    .fc .fc-button:hover {
        background: linear-gradient(135deg, #19a1a1 0%, #56dfdf 100%) !important;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2) !important;
        transform: translateY(-1px);
    }

    .fc-daygrid-day.fc-day-today {
        background-color: rgba(25, 161, 161, 0.08) !important;
    }

    #calendar {
        min-height: 750px;
    }

    .type-select-card {
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
        background-color: #f8f9fa;
        border-radius: 8px;
    }

    input[type="radio"]:checked+.type-select-card {
        border-color: #19a1a1;
        background-color: rgba(25, 161, 161, 0.08);
        transform: scale(1.02);
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h4>Calendar Overview</h4>
            </div>
            <div class="col-6">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin-panel/user-management-page"><svg class="stroke-icon">
                                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
                            </svg></a></li>
                    <li class="breadcrumb-item active">Special Days</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header pb-0 d-flex justify-content-between align-items-center">
                    <h5>Event Calendar</h5>
                    <button class="btn btn-primary" onclick="openModal(null, new Date().toISOString().split('T')[0])">
                        <i class="fa fa-plus me-2"></i> Add Special Day
                    </button>
                </div>
                <div class="card-body">
                    <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:16px;">
            <div class="modal-header bg-primary text-white" style="border-radius:16px 16px 0 0;">
                <h5 class="modal-title" id="modalTitle"><i class="fa fa-calendar-plus-o me-2"></i> Add Special Day</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="eventForm">
                    <input type="hidden" id="eventId">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Event Title *</label>
                        <input type="text" class="form-control" id="eventTitle" placeholder="e.g. Earth Day" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-weight-bold">Date *</label>
                            <input type="date" class="form-control" id="eventDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-weight-bold">Activity (Optional)</label>
                            <input type="text" class="form-control" id="eventActivity" placeholder="e.g. Experiment">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Description *</label>
                        <textarea class="form-control" id="eventDesc" rows="3" required></textarea>
                    </div>
                    <div class="mb-2">
                        <label class="form-label font-weight-bold">Event Type</label>
                        <div class="row g-2">
                            <div class="col-3">
                                <label class="w-100">
                                    <input type="radio" name="eventType" value="Event" class="d-none" checked>
                                    <div class="card type-select-card text-center p-2 h-100 mb-0 shadow-sm">
                                        <i class="fa fa-calendar-check-o text-primary mb-1"></i>
                                        <h6 class="mb-0 small">General</h6>
                                    </div>
                                </label>
                            </div>
                            <div class="col-3">
                                <label class="w-100">
                                    <input type="radio" name="eventType" value="Holiday" class="d-none">
                                    <div class="card type-select-card text-center p-2 h-100 mb-0 shadow-sm">
                                        <i class="fa fa-star text-danger mb-1"></i>
                                        <h6 class="mb-0 small">Holiday</h6>
                                    </div>
                                </label>
                            </div>
                            <div class="col-3">
                                <label class="w-100">
                                    <input type="radio" name="eventType" value="Exam" class="d-none">
                                    <div class="card type-select-card text-center p-2 h-100 mb-0 shadow-sm">
                                        <i class="fa fa-pencil-square-o text-dark mb-1"></i>
                                        <h6 class="mb-0 small">Exam</h6>
                                    </div>
                                </label>
                            </div>
                            <div class="col-3">
                                <label class="w-100">
                                    <input type="radio" name="eventType" value="Celebration" class="d-none">
                                    <div class="card type-select-card text-center p-2 h-100 mb-0 shadow-sm">
                                        <i class="fa fa-gift text-warning mb-1"></i>
                                        <h6 class="mb-0 small">Celebration</h6>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-outline-danger me-auto" id="deleteBtn" style="display: none;"
                    onclick="deleteEvent()">Delete</button>
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveEvent()">Save Event</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = window.token || localStorage.getItem("admin_token");
    const API_BASE = window.API_BASE;
    let mainCalendar;
    let modalInstance;

    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        modalInstance = new bootstrap.Modal(document.getElementById('eventModal'));

        mainCalendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth,listYear'
            },
            themeSystem: 'bootstrap5',
            events: fetchEvents,
            dateClick: (info) => openModal(null, info.dateStr),
            eventClick: (info) => openModal(info.event),
            eventContent: function (arg) {
                let icon = '📅';
                const type = arg.event.extendedProps.type;
                if (type === 'Holiday') icon = '★';
                else if (type === 'Exam') icon = '📝';
                else if (type === 'Celebration') icon = '🎉';
                return {
                    html: `<div class="fc-content text-truncate"><span class="me-1">${icon}</span><span class="fw-bold">${arg.event.title}</span></div>`
                };
            }
        });
        mainCalendar.render();
    });

    async function fetchEvents(info, success, failure) {
        try {
            const res = await fetch(`${API_BASE}/admin-panel/special-days/`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const data = await res.json();
            const events = data.map(d => ({
                id: d.id, title: d.title, start: d.date,
                extendedProps: { description: d.description, activity: d.activity, type: d.type },
                backgroundColor: getColorByType(d.type), borderColor: getColorByType(d.type),
                textColor: d.type === 'Celebration' ? '#333' : '#fff'
            }));
            success(events);
        } catch (err) { failure(err); }
    }

    function getColorByType(type) {
        if (type === 'Holiday') return '#ff6b6b';
        if (type === 'Exam') return '#2c3e50';
        if (type === 'Celebration') return '#ffd93b';
        return '#19a1a1';
    }

    function openModal(event, dateStr) {
        document.getElementById('eventForm').reset();
        document.getElementById('deleteBtn').style.display = event ? 'block' : 'none';
        if (event) {
            document.getElementById('modalTitle').textContent = 'Edit Special Day';
            document.getElementById('eventId').value = event.id;
            document.getElementById('eventDate').value = event.startStr;
            document.getElementById('eventTitle').value = event.title;
            document.getElementById('eventDesc').value = event.extendedProps.description;
            document.getElementById('eventActivity').value = event.extendedProps.activity || '';
            const typeRadio = document.querySelector(`input[name="eventType"][value="${event.extendedProps.type}"]`);
            if (typeRadio) typeRadio.checked = true;
        } else {
            document.getElementById('modalTitle').textContent = 'Add Special Day';
            document.getElementById('eventId').value = '';
            document.getElementById('eventDate').value = dateStr || new Date().toISOString().split('T')[0];
            document.querySelector('input[name="eventType"][value="Event"]').checked = true;
        }
        modalInstance.show();
    }

    async function saveEvent() {
        const id = document.getElementById('eventId').value;
        const payload = {
            date: document.getElementById('eventDate').value,
            title: document.getElementById('eventTitle').value,
            description: document.getElementById('eventDesc').value,
            activity: document.getElementById('eventActivity').value,
            type: document.querySelector('input[name="eventType"]:checked').value,
            is_active: true
        };
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_BASE}/admin-panel/special-days/${id}` : `${API_BASE}/admin-panel/special-days/`;
        const res = await fetch(url, {
            method, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (res.ok) { modalInstance.hide(); mainCalendar.refetchEvents(); }
    }

    async function deleteEvent() {
        if (!confirm("Delete this event?")) return;
        const id = document.getElementById('eventId').value;
        const res = await fetch(`${API_BASE}/admin-panel/special-days/${id}`, {
            method: "DELETE", headers: { "Authorization": "Bearer " + token }
        });
        if (res.ok) { modalInstance.hide(); mainCalendar.refetchEvents(); }
    }
</script>
{% endblock %}
