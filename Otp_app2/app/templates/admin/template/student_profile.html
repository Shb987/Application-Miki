{% extends "base.html" %}

{% block title %}Student Profile - Miki Admin{% endblock %}

{% block head %}
<style>
    /* Premium Dashboard Styles */
    .profile-header-card {
        background: linear-gradient(135deg, #7366ff 0%, #13c9ca 100%);
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    
    .profile-header-overlay {
        background: rgba(255, 255, 255, 0.1); /* Subtle overlay over the gradient */
        backdrop-filter: blur(2px);
        padding: 40px;
        display: flex;
        align-items: center;
        gap: 30px;
        color: #fff;
    }
    
    .profile-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #fff;
        color: #7366ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 800;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        border: 4px solid rgba(255,255,255,0.3);
    }
    
    .profile-name {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 5px;
        letter-spacing: -0.5px;
    }
    
    .profile-badge {
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.4);
        padding: 6px 15px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .profile-badge.tier-plus { background: linear-gradient(135deg, rgba(115,102,255,0.9), rgba(168,85,247,0.9)); }
    .profile-badge.tier-pro { background: linear-gradient(135deg, rgba(247,49,100,0.9), rgba(255,126,95,0.9)); }
    
    /* Quota Widgets */
    .quota-widget {
        background: #fff;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.03);
        border: 1px solid #f0f0f0;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
        height: 100%;
    }
    
    .quota-widget:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(115, 102, 255, 0.08);
    }
    
    .quota-icon-bg {
        position: absolute;
        right: -15px;
        top: -15px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        opacity: 0.05;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .quota-icon-bg i {
        width: 50px;
        height: 50px;
    }
    
    .quota-title {
        font-size: 0.9rem;
        color: #888;
        font-weight: 600;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .quota-value {
        font-size: 2.2rem;
        font-weight: 800;
        color: #2b2b2b;
        line-height: 1;
    }
    
    .quota-unit {
        font-size: 0.9rem;
        color: #999;
        font-weight: 500;
        margin-left: 5px;
    }
    
    /* Content Cards */
    .content-card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.03);
        border: 1px solid #f0f0f0;
        margin-bottom: 30px;
        overflow: hidden;
    }
    
    .content-header {
        padding: 20px 25px;
        border-bottom: 1px solid #f5f5f5;
        background: #fdfdfd;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .content-header h5 {
        margin: 0;
        font-weight: 700;
        color: #2b2b2b;
    }
    
    .content-body {
        padding: 25px;
    }
    
    /* Intelligence Progress Bars */
    .intel-row {
        margin-bottom: 15px;
    }
    
    .intel-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        color: #555;
        text-transform: capitalize;
    }
    
    .intel-progress {
        height: 10px;
        background: #f0f0f0;
        border-radius: 10px;
        overflow: hidden;
    }
    
    .intel-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 1s ease-in-out;
    }
    
    /* Info List */
    .info-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    
    .info-list li {
        padding: 12px 0;
        border-bottom: 1px dashed #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .info-list li:last-child {
        border-bottom: none;
    }
    
    .info-label {
        color: #888;
        font-size: 0.9rem;
        font-weight: 500;
    }
    
    .info-value {
        font-weight: 700;
        color: #2b2b2b;
        font-size: 0.95rem;
    }
    
    .edit-quota-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(0,0,0,0.03);
        border: none;
        border-radius: 8px;
        padding: 5px 8px;
        color: #888;
        cursor: pointer;
        transition: all 0.2s;
        z-index: 10;
    }
    
    .edit-quota-btn:hover {
        background: #f0f0f0;
        color: #7366ff;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="page-title">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center gap-3">
                <button onclick="location.href='/admin-panel/user-management-page?tab=students'" class="btn btn-sm btn-outline-primary d-flex align-items-center" style="border-radius: 8px; padding: 6px 12px; font-weight: 600;">
                    <i data-feather="arrow-left" style="width:16px;height:16px;margin-right:6px;"></i> Back
                </button>
                <h4 class="mb-0"><i data-feather="user" style="width:20px;height:20px;color:#7366ff;margin-right:8px;"></i> Student Profile</h4>
            </div>
            <div class="col-6">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin-panel/dashboard"><svg class="stroke-icon"><use href="/assets/svg/icon-sprite.svg#stroke-home"></use></svg></a></li>
                    <li class="breadcrumb-item"><a href="/admin-panel/user-management-page">User Management</a></li>
                    <li class="breadcrumb-item active">Profile</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" id="profile-container">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <h5 class="mt-3 text-muted">Curating Student Data...</h5>
    </div>
</div>

<!-- Edit Quota Modal -->
<div class="modal fade" id="editQuotaModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header" style="background: linear-gradient(135deg, #7366ff, #13c9ca); color: #fff; border-radius: 16px 16px 0 0;">
                <h5 class="modal-title"><i data-feather="edit-2" style="width:18px;height:18px;margin-right:6px;"></i> Edit Quota</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-bucket-name">
                <div class="mb-3">
                    <label class="form-label text-muted" id="edit-quota-label">New Balance</label>
                    <input type="number" class="form-control" id="edit-quota-value" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveQuota()">Save Quota</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = window.token || localStorage.getItem("admin_token");
    const API_BASE = window.API_BASE;
    const studentId = "{{ student_id }}";

    async function loadStudentProfile() {
        try {
            const res = await fetch(`${API_BASE}/admin-panel/users/student/${studentId}`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const json = await res.json();
            
            if (json.status === "success") {
                renderProfile(json.data);
            } else {
                document.getElementById("profile-container").innerHTML = `<div class="alert alert-danger">Failed to load student profile.</div>`;
            }
        } catch (e) {
            console.error("Error loading profile:", e);
            document.getElementById("profile-container").innerHTML = `<div class="alert alert-danger">An error occurred while loading the profile.</div>`;
        }
    }

    function renderProfile(data) {
        const s = data.student || {};
        const career = data.career || {};
        const pct = career.percentages || {};
        const quizCount = data.quiz_attempts || 0;
        
        // Setup Tier Colors
        let tier = s.subscription && s.subscription.current_tier ? s.subscription.current_tier : "basic";
        let badgeClass = "tier-basic";
        if (tier === "plus") badgeClass = "tier-plus";
        if (tier === "pro") badgeClass = "tier-pro";
        
        // Quotas
        const quotas = s.usage_buckets || {};
        const tutorQs = quotas.tutor_balance_qs !== undefined ? quotas.tutor_balance_qs : 0;
        const examQs = quotas.exam_balance !== undefined ? quotas.exam_balance : 0;
        const classQs = quotas.class_balance !== undefined ? quotas.class_balance : 0;
        const voiceQs = quotas.voice_balance_mins !== undefined ? quotas.voice_balance_mins : 0;
        
        const avatarLetter = (s.student_name || "S").charAt(0).toUpperCase();
        
        let avatarHtml = `<div class="profile-avatar">${avatarLetter}</div>`;
        if (s.image_url) {
            let imgPath = s.image_url.startsWith('http') ? s.image_url : `/${s.image_url}`;
            avatarHtml = `<img src="${imgPath}" alt="${s.student_name}" class="profile-avatar" style="object-fit: cover;">`;
        }
        
        let html = `
        <!-- Hero Header -->
        <div class="profile-header-card">
            <div class="profile-header-overlay">
                ${avatarHtml}
                <div>
                    <h1 class="profile-name">${s.student_name || "Unknown Student"}</h1>
                    <div class="d-flex align-items-center gap-3 mt-2">
                        <span class="profile-badge ${badgeClass}"><i data-feather="shield" style="width:14px;height:14px;margin-right:4px;"></i> ${tier} Plan</span>
                        <span><i data-feather="book-open" style="width:14px;height:14px;margin-right:4px;"></i> Class ${s.student_class || "N/A"}</span>
                        <span><i data-feather="calendar" style="width:14px;height:14px;margin-right:4px;"></i> Joined: ${new Date(s.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Quota Widgets -->
        <div class="row g-4 mb-4">
            <div class="col-xl-3 col-sm-6">
                <div class="quota-widget">
                    <button class="edit-quota-btn" onclick="openQuotaModal('tutor_balance_qs', 'AI Tutor', ${tutorQs})"><i data-feather="edit-2" style="width:14px;height:14px;"></i></button>
                    <div class="quota-icon-bg" style="background: #7366ff; color: #7366ff;"><i data-feather="message-circle"></i></div>
                    <div class="quota-title text-primary">AI Tutor Balance</div>
                    <div class="quota-value">${tutorQs} <span class="quota-unit">Queries</span></div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6">
                <div class="quota-widget">
                    <button class="edit-quota-btn" onclick="openQuotaModal('exam_balance', 'Exam Evaluator', ${examQs})"><i data-feather="edit-2" style="width:14px;height:14px;"></i></button>
                    <div class="quota-icon-bg" style="background: #f73164; color: #f73164;"><i data-feather="file-text"></i></div>
                    <div class="quota-title" style="color: #f73164;">Exam Evaluator</div>
                    <div class="quota-value">${examQs} <span class="quota-unit">Exams</span></div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6">
                <div class="quota-widget">
                    <button class="edit-quota-btn" onclick="openQuotaModal('class_balance', 'Digital Tuition', ${classQs})"><i data-feather="edit-2" style="width:14px;height:14px;"></i></button>
                    <div class="quota-icon-bg" style="background: #13c9ca; color: #13c9ca;"><i data-feather="video"></i></div>
                    <div class="quota-title" style="color: #13c9ca;">Digital Tuition</div>
                    <div class="quota-value">${classQs} <span class="quota-unit">Sessions</span></div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6">
                <div class="quota-widget">
                    <button class="edit-quota-btn" onclick="openQuotaModal('voice_balance_mins', 'Voice Assistant', ${voiceQs})"><i data-feather="edit-2" style="width:14px;height:14px;"></i></button>
                    <div class="quota-icon-bg" style="background: #ff9f40; color: #ff9f40;"><i data-feather="mic"></i></div>
                    <div class="quota-title" style="color: #ff9f40;">Voice Assistant</div>
                    <div class="quota-value">${voiceQs} <span class="quota-unit">Minutes</span></div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- Left Column: Intelligence DNA -->
            <div class="col-xl-7 col-lg-12">
                <div class="content-card">
                    <div class="content-header">
                        <div style="background:rgba(115,102,255,0.1); color:#7366ff; padding:8px; border-radius:10px;"><i data-feather="cpu" style="width:18px;height:18px;"></i></div>
                        <h5>Intelligence DNA Profile</h5>
                    </div>
                    <div class="content-body">
                        ${renderIntelligenceBars(pct, career.recommended_career)}
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Details & Financials -->
            <div class="col-xl-5 col-lg-12">
                
                <div class="content-card">
                    <div class="content-header">
                        <div style="background:rgba(19,201,202,0.1); color:#13c9ca; padding:8px; border-radius:10px;"><i data-feather="credit-card" style="width:18px;height:18px;"></i></div>
                        <h5>Financial Overview</h5>
                    </div>
                    <div class="content-body" style="padding: 15px 25px;">
                        <ul class="info-list">
                            <li>
                                <span class="info-label">Total Spend</span>
                                <span class="info-value" style="color:#13c9ca; font-size: 1.2rem;">₹${s.subscription && s.subscription.total_spend ? s.subscription.total_spend : 0}</span>
                            </li>
                            <li>
                                <span class="info-label">Last Recharge</span>
                                <span class="info-value">${s.subscription && s.subscription.last_recharge_date ? new Date(s.subscription.last_recharge_date).toLocaleDateString() : "Never"}</span>
                            </li>
                            <li>
                                <span class="info-label">Completed Quizzes</span>
                                <span class="info-value">${quizCount}</span>
                            </li>
                        </ul>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="content-header">
                        <div style="background:rgba(247,49,100,0.1); color:#f73164; padding:8px; border-radius:10px;"><i data-feather="info" style="width:18px;height:18px;"></i></div>
                        <h5>Demographics</h5>
                    </div>
                    <div class="content-body" style="padding: 15px 25px;">
                        <ul class="info-list">
                            <li><span class="info-label">Date of Birth</span><span class="info-value">${s.dob || "—"}</span></li>
                            <li><span class="info-label">Age</span><span class="info-value">${s.age || "—"}</span></li>
                            <li><span class="info-label">Guardian</span><span class="info-value">${s.guardian_name || "—"}</span></li>
                            <li><span class="info-label">Address</span><span class="info-value" style="text-align:right; max-width: 60%;">${s.address || "—"}</span></li>
                        </ul>
                    </div>
                </div>
                
            </div>
        </div>
        
        <!-- Payment History Row -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="content-card">
                    <div class="content-header">
                        <div style="background:rgba(84,186,74,0.1); color:#54ba4a; padding:8px; border-radius:10px;"><i data-feather="shopping-cart" style="width:18px;height:18px;"></i></div>
                        <h5>Payment History</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" style="font-size: 0.9rem;">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="px-4 py-3">Date</th>
                                        <th>Order ID</th>
                                        <th>Tier</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="student-transactions-body">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">Loading payments...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        `;
        
        document.getElementById("profile-container").innerHTML = html;
        feather.replace();
        
        loadStudentTransactions();
    }
    
    function renderIntelligenceBars(pct, recommended) {
        if (!pct || Object.keys(pct).length === 0) {
            return `<div class="text-center py-5 text-muted">
                <i data-feather="help-circle" style="width:48px;height:48px; opacity:0.3; margin-bottom:15px;"></i>
                <p>Intelligence test not yet completed by this student.</p>
            </div>`;
        }
        
        const cats = ["verbal-linguistic", "logical-mathematical", "visual-spatial", "bodily-kinesthetic", "musical", "interpersonal", "intrapersonal", "naturalist"];
        const catColors = ["#7366ff", "#13c9ca", "#f73164", "#ff9f40", "#54ba4a", "#6610f2", "#fd7e14", "#20c997"];
        
        let html = `<div style="margin-bottom: 25px; padding: 15px; background: rgba(115,102,255,0.05); border-radius: 12px; border: 1px solid rgba(115,102,255,0.1);">
            <div style="font-size:0.8rem; color:#7366ff; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">AI Recommended Career Path</div>
            <div style="font-size:1.2rem; font-weight:800; color:#2b2b2b; margin-top:5px;">${recommended || "Not Available"}</div>
        </div>`;
        
        html += `<div class="row pe-4">`;
        cats.forEach((c, i) => {
            const val = pct[c] || 0;
            html += `
            <div class="col-md-6 mb-4">
                <div class="intel-label">
                    <span>${c.replace("-", " ")}</span>
                    <span style="color: ${catColors[i]};">${val}%</span>
                </div>
                <div class="intel-progress">
                    <div class="intel-fill" style="width: ${val}%; background: ${catColors[i]};"></div>
                </div>
            </div>`;
        });
        html += `</div>`;
        
        return html;
    }
    
    function openQuotaModal(bucketName, displayName, currentValue) {
        document.getElementById("edit-bucket-name").value = bucketName;
        document.getElementById("edit-quota-label").innerText = `New ${displayName} Balance`;
        document.getElementById("edit-quota-value").value = currentValue;
        
        const modal = new bootstrap.Modal(document.getElementById("editQuotaModal"));
        modal.show();
    }
    
    async function saveQuota() {
        const bucket = document.getElementById("edit-bucket-name").value;
        const newVal = parseInt(document.getElementById("edit-quota-value").value);
        
        try {
            const res = await fetch(`${API_BASE}/admin-panel/users/student/${studentId}/quotas`, {
                method: "PATCH",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ bucket: bucket, new_value: newVal })
            });
            const json = await res.json();
            
            if (json.status === "success") {
                const modal = bootstrap.Modal.getInstance(document.getElementById("editQuotaModal"));
                modal.hide();
                loadStudentProfile(); // Reload the whole profile to reflect changes safely
            } else {
                alert("Failed to update quota: " + json.detail);
            }
        } catch (e) {
            console.error(e);
            alert("Error updating quota");
        }
    }
    
    async function loadStudentTransactions() {
        try {
            const res = await fetch(`${API_BASE}/admin-panel/transactions/student/${studentId}`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const json = await res.json();
            
            const tbody = document.getElementById("student-transactions-body");
            if (json.status_code === 200) {
                tbody.innerHTML = "";
                if (json.transactions.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No payments found.</td></tr>`;
                    return;
                }
                
                json.transactions.forEach(t => {
                    const date = new Date(t.created_at).toLocaleString();
                    const amount = (t.amount / 100).toLocaleString('en-IN');
                    let statusBadge = "bg-warning";
                    if (t.status === "success" || t.status === "paid") statusBadge = "bg-success";
                    if (t.status === "failed") statusBadge = "bg-danger";
                    
                    tbody.innerHTML += `
                    <tr>
                        <td class="px-4">${date}</td>
                        <td style="font-family:monospace; color:#666;">${t.order_id || t.payment_id || "—"}</td>
                        <td style="text-transform:uppercase; font-weight:600; font-size:0.8rem;">${t.tier}</td>
                        <td style="font-weight:700;">₹${amount}</td>
                        <td><span class="badge ${statusBadge}">${t.status}</span></td>
                    </tr>`;
                });
            }
        } catch (e) {
            console.error("Error loading student transactions:", e);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadStudentProfile();
    });
</script>
{% endblock %}
