<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Syllabus</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
</head>
<body class="p-5">

    <div class="container text-center mt-5">
        <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status"></div>
        <h3 class="mt-4">Processing syllabus…</h3>
        <p>Please wait while we extract chapters and build vectors.</p>
    </div>

    <script>
        const syllabusId = "{{ syllabus_id }}";

        async function processNow() {
            let response = await fetch(`/admin-panel/process-syllabus/${syllabusId}`, {
                method: "POST"
            });

            let result = await response.json();

            if (result.status === "completed") {
                window.location.href = "/admin-panel/exam_module-page?done=1";
            }
        }

        // Auto start
        window.onload = () => processNow();
    </script>

</body>
</html>
