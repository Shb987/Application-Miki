<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miki Studio | Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7fe;
            color: #2b3674;
        }

        /* Top Navigation */
        .navbar-custom {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.4rem;
            color: #7366ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            border: 1px solid #ff4b4b;
            color: #ff4b4b;
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-logout:hover {
            background: #ff4b4b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 75, 75, 0.2);
        }

        /* Main Area */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .btn-primary-gradient {
            background: linear-gradient(135deg, #7366ff, #51bbfe);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(115, 102, 255, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-gradient:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(115, 102, 255, 0.4);
            color: white;
        }

        /* Content Cards */
        .content-card {
            background: white;
            border-radius: 20px;
            border: none;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .content-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(115, 102, 255, 0.1);
        }

        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #2b3674;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-text {
            color: #a3aed1;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .tag-pill {
            background: rgba(115, 102, 255, 0.1);
            color: #7366ff;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            margin-top: 15px;
            border-top: 1px solid #f4f7fe;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .stat-item.views { color: #51bbfe; }
        .stat-item.likes { color: #f73164; }

        /* Modal Design */
        .modal-content {
            border-radius: 24px;
            border: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .modal-header {
            border-bottom: 1px solid #f4f7fe;
            padding: 25px 30px;
        }

        .modal-body {
            padding: 30px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e0e5f2;
            background: #f4f7fe;
            color: #2b3674;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            background: white;
            border-color: #7366ff;
            box-shadow: 0 0 15px rgba(115, 102, 255, 0.1);
        }

        .form-label {
            font-weight: 600;
            color: #2b3674;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<nav class="navbar-custom">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="#" class="brand-logo">
        <div style="background: linear-gradient(135deg, #7366ff, #51bbfe); padding: 8px; border-radius: 12px; color: white;">
            <i data-feather="monitor" style="width: 20px; height: 20px;"></i>
        </div>
        MIKI STUDIO
    </a>
    <button class="btn btn-logout" onclick="logout()">
        <i data-feather="log-out" style="width: 14px; margin-right: 4px;"></i> Disconnect
    </button>
  </div>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <h2 style="font-weight: 700;">My Workspace</h2>
            <p style="color: #a3aed1; margin: 0;">Manage and monitor your educational content.</p>
        </div>
        <button class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#addContentModal">
            <i data-feather="plus-circle" style="width: 18px;"></i> Create Post
        </button>
    </div>

    <div class="row g-4" id="contentGrid">
        <!-- Loaded via JS -->
    </div>
</div>

<!-- Add Content Modal -->
<div class="modal fade" id="addContentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" style="font-weight: 700; color: #2b3674;">Draft New Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addContentForm">
            <div class="mb-4">
                <label class="form-label">Post Title</label>
                <input type="text" id="contentTitle" class="form-control" placeholder="Catchy title for the students..." required>
            </div>
            <div class="mb-4">
                <label class="form-label">Article Body / Description</label>
                <textarea id="contentDescription" class="form-control" rows="5" placeholder="Share your knowledge..." required></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Format</label>
                    <select id="mediaType" class="form-select">
                        <option value="text">Text Article</option>
                        <option value="image">Image Gallery</option>
                        <option value="video">Video Lesson</option>
                    </select>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Media URL</label>
                    <input type="url" id="mediaUrl" class="form-control" placeholder="Optional (e.g. YouTube Link)">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <label class="form-label">Target Age</label>
                    <input type="text" id="targetAge" class="form-control" placeholder="e.g. 10-15">
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label">Target Class</label>
                    <input type="text" id="targetClass" class="form-control" placeholder="e.g. 8">
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label">Topic / Skill Tag</label>
                    <select id="skillTags" class="form-select" required>
                        <option value="" disabled selected>Select a relevant topic</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Coding">Coding / Computer Science</option>
                        <option value="Art">Art & Design</option>
                        <option value="Music">Music</option>
                        <option value="Logical Reasoning">Logical Reasoning</option>
                        <option value="General Knowledge">General Knowledge</option>
                        <option value="History">History</option>
                        <option value="Geography">Geography</option>
                        <option value="Astronomy">Astronomy</option>
                        <option value="Robotics">Robotics</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-gradient w-100" style="padding: 14px; font-size: 1.1rem; justify-content: center;">
                Publish to Feed
            </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    feather.replace();
    
    const API_BASE = window.location.origin;
    const contributorId = localStorage.getItem("contributor_id");

    if (!contributorId) {
        window.location.href = "/contributor/login-page";
    }

    let currentSkip = 0;
    const LIMIT = 12;
    let currentEditId = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadContent(true);

        document.getElementById("addContentModal").addEventListener("hidden.bs.modal", () => {
            document.getElementById("addContentForm").reset();
            currentEditId = null;
            document.querySelector("#addContentModal .modal-title").textContent = "Draft New Post";
            document.querySelector("#addContentForm button[type=submit]").textContent = "Publish to Feed";
        });

        document.getElementById("addContentForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const selectedTag = document.getElementById("skillTags").value;
            const skill_tags = selectedTag ? [selectedTag] : [];

            const payload = {
                title: document.getElementById("contentTitle").value,
                description: document.getElementById("contentDescription").value,
                media_type: document.getElementById("mediaType").value,
                media_url: document.getElementById("mediaUrl").value || null,
                target_age_group: document.getElementById("targetAge").value || null,
                target_class: document.getElementById("targetClass").value || null,
                skill_tags: skill_tags
            };

            const submitBtn = e.target.querySelector('button');
            const origText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';

            try {
                let res;
                if (currentEditId) {
                    res = await fetch(`${API_BASE}/contributor/content/${currentEditId}?contributor_id=${contributorId}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(`${API_BASE}/contributor/content?contributor_id=${contributorId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                }
                
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("addContentModal")).hide();
                    loadContent(true);
                } else {
                    const err = await res.json();
                    alert(`Error: ${err.detail}`);
                }
            } catch (err) {
                console.error(err);
                alert("An error occurred");
            } finally {
                submitBtn.innerHTML = origText;
            }
        });
    });

    async function loadContent(reset = false) {
        const grid = document.getElementById("contentGrid");
        if (reset) {
            currentSkip = 0;
            grid.innerHTML = '<div class="text-center py-5 w-100" id="loadingSpinner"><div class="spinner-border" style="color: #7366ff;"></div></div>';
        } else {
            const loadBtn = document.getElementById("loadMoreBtn");
            if (loadBtn) loadBtn.remove();
            grid.insertAdjacentHTML('beforeend', '<div class="text-center py-3 w-100" id="loadingSpinner"><div class="spinner-border spinner-border-sm" style="color: #7366ff;"></div></div>');
        }

        try {
            const res = await fetch(`${API_BASE}/contributor/content?contributor_id=${contributorId}&skip=${currentSkip}&limit=${LIMIT}`);
            const contents = await res.json();
            
            document.getElementById("loadingSpinner")?.remove();

            if (reset && contents.length === 0) {
                grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div style="background: white; border-radius: 20px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
                        <i data-feather="inbox" style="width: 60px; height: 60px; color: #a3aed1; margin-bottom: 20px;"></i>
                        <h4 style="font-weight: 700; color: #2b3674;">It's empty here!</h4>
                        <p style="color: #a3aed1;">You haven't published any content yet. Start sharing your knowledge.</p>
                    </div>
                </div>`;
                feather.replace();
                return;
            }

            if (reset) grid.innerHTML = '';

            contents.forEach(c => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                
                const card = document.createElement('div');
                card.className = 'content-card';
                card.style.position = 'relative';

                // Image/Video placeholder
                if (c.media_type === 'image' && c.media_url) {
                    const img = document.createElement('img');
                    img.src = c.media_url;
                    img.alt = c.title || "Content Image";
                    img.style.cssText = "width:100%; height:150px; object-fit:cover; border-radius:10px; margin-bottom:14px;";
                    img.onerror = () => img.style.display = 'none';
                    card.appendChild(img);
                } else if (c.media_type === 'video' && c.media_url) {
                    const vidDiv = document.createElement('div');
                    vidDiv.style.cssText = "background:linear-gradient(135deg,#7366ff22,#51bbfe22); border-radius:10px; height:80px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;";
                    vidDiv.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 24 24' fill='none' stroke='#7366ff' stroke-width='2'><polygon points='5 3 19 12 5 21 5 3'></polygon></svg>`;
                    card.appendChild(vidDiv);
                }

                // Title
                const title = document.createElement('h5');
                title.className = 'card-title';
                title.textContent = c.title; // Safe against XSS
                card.appendChild(title);

                // Description
                const desc = document.createElement('p');
                desc.className = 'card-text';
                desc.style.cssText = "display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;";
                desc.textContent = c.description; // Safe against XSS
                card.appendChild(desc);

                // Info Row
                const infoRow = document.createElement('div');
                infoRow.className = 'd-flex justify-content-between align-items-center mb-3';
                infoRow.innerHTML = `
                    <span style="font-size: 0.8rem; font-weight: 600; color: #bd5fff;">
                        <svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' style='margin-right:4px;vertical-align:middle;'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'></rect><circle cx='8.5' cy='8.5' r='1.5'></circle><polyline points='21 15 16 10 5 21'></polyline></svg>
                        ${(c.media_type || '').toUpperCase()}
                    </span>
                    <span style="font-size: 0.8rem; font-weight: 600; color: #51bbfe;">
                        <svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' style='margin-right:4px;vertical-align:middle;'><path d='M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'></path><circle cx='9' cy='7' r='4'></circle><path d='M23 21v-2a4 4 0 0 0-3-3.87'></path><path d='M16 3.13a4 4 0 0 1 0 7.75'></path></svg>
                        Class ${c.target_class || 'All'}
                    </span>
                `;
                card.appendChild(infoRow);

                // Tags
                const tagsDiv = document.createElement('div');
                tagsDiv.style.marginBottom = "auto";
                if (c.skill_tags) {
                    c.skill_tags.forEach(t => {
                        const tagSpan = document.createElement('span');
                        tagSpan.className = 'tag-pill';
                        tagSpan.textContent = t;
                        tagsDiv.appendChild(tagSpan);
                    });
                }
                card.appendChild(tagsDiv);

                // Action Row (Edit/Delete)
                const actionRow = document.createElement('div');
                actionRow.className = 'd-flex justify-content-end gap-2 mt-3';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-sm btn-outline-primary d-flex align-items-center justify-content-center';
                editBtn.style.padding = '5px 10px';
                editBtn.innerHTML = '<i data-feather="edit-2" style="width: 14px; height: 14px;"></i>';
                editBtn.onclick = () => editContent(c);
                actionRow.appendChild(editBtn);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center';
                delBtn.style.padding = '5px 10px';
                delBtn.innerHTML = '<i data-feather="trash-2" style="width: 14px; height: 14px;"></i>';
                delBtn.onclick = () => deleteContent(c._id);
                actionRow.appendChild(delBtn);

                card.appendChild(actionRow);

                // Stats Row
                const statsRow = document.createElement('div');
                statsRow.className = 'stats-row mt-3';
                statsRow.innerHTML = `
                    <div class="stat-item views" title="Views">
                        <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'></path><circle cx='12' cy='12' r='3'></circle></svg> ${c.views_count || 0}
                    </div>
                    <div class="stat-item likes" title="Likes">
                        <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'></path></svg> ${c.likes_count || 0}
                    </div>
                    <div class="stat-item shares" style="color: #7366ff;" title="Shares">
                        <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='18' cy='5' r='3'></circle><circle cx='6' cy='12' r='3'></circle><circle cx='18' cy='19' r='3'></circle><line x1='8.59' y1='13.51' x2='15.42' y2='17.49'></line><line x1='15.41' y1='6.51' x2='8.59' y2='10.49'></line></svg> ${c.shares_count || 0}
                    </div>
                `;
                card.appendChild(statsRow);

                col.appendChild(card);
                grid.appendChild(col);
            });

            feather.replace();

            if (contents.length === LIMIT) {
                currentSkip += LIMIT;
                const btnContainer = document.createElement('div');
                btnContainer.className = 'col-12 text-center mt-4 mb-4';
                btnContainer.id = 'loadMoreBtn';
                const loadBtn = document.createElement('button');
                loadBtn.className = 'btn btn-outline-primary px-4 py-2 rounded-pill fw-bold';
                loadBtn.textContent = 'Load More';
                loadBtn.onclick = () => loadContent(false);
                btnContainer.appendChild(loadBtn);
                grid.appendChild(btnContainer);
            }

        } catch (err) {
            console.error(err);
            document.getElementById("loadingSpinner")?.remove();
            if (reset) grid.innerHTML = '<div class="text-center py-5 w-100 text-danger">Error loading content</div>';
        }
    }

    function editContent(c) {
        currentEditId = c._id;
        document.getElementById("contentTitle").value = c.title;
        document.getElementById("contentDescription").value = c.description;
        document.getElementById("mediaType").value = c.media_type;
        document.getElementById("mediaUrl").value = c.media_url || "";
        document.getElementById("targetAge").value = c.target_age_group || "";
        document.getElementById("targetClass").value = c.target_class || "";
        document.getElementById("skillTags").value = (c.skill_tags && c.skill_tags.length > 0) ? c.skill_tags[0] : "";
        
        document.querySelector("#addContentModal .modal-title").textContent = "Edit Post";
        document.querySelector("#addContentForm button[type=submit]").textContent = "Update Content";
        
        const modal = new bootstrap.Modal(document.getElementById("addContentModal"));
        modal.show();
    }

    async function deleteContent(id) {
        if (!confirm("Are you sure you want to delete this content?")) return;
        
        try {
            const res = await fetch(`${API_BASE}/contributor/content/${id}?contributor_id=${contributorId}`, {
                method: "DELETE"
            });
            if (res.ok) {
                loadContent(true);
            } else {
                alert("Failed to delete content");
            }
        } catch(err) {
            console.error(err);
            alert("Error deleting content");
        }
    }

    function logout() {
        localStorage.removeItem("contributor_id");
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.4s ease';
        setTimeout(() => {
            window.location.href = "/contributor/login-page";
        }, 400);
    }
</script>

</body>
</html>
