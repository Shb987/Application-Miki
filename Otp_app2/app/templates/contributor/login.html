<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributor Login | Miki Social</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Vibrant Animated Gradient Background */
            background: linear-gradient(-45deg, #7366ff, #51bbfe, #bd5fff, #f73164);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: white;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #7366ff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.3);
            color: #bd5fff;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .brand-icon {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 50%;
            display: inline-flex;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        .alert-danger {
            background: rgba(247, 49, 100, 0.8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center login-wrapper">
    <div class="glass-card">
        <div class="text-center">
            <div class="brand-icon">
                <i data-feather="monitor" style="width: 32px; height: 32px; color: white;"></i>
            </div>
            <h3 style="font-weight: 700; letter-spacing: 1px; margin-bottom: 5px;">MIKI STUDIO</h3>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 30px;">Contributor Portal</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-4">
                <label class="form-label">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-right: none; color: white; border-radius: 12px 0 0 12px;">
                        <i data-feather="user" style="width: 18px;"></i>
                    </span>
                    <input type="text" id="username" class="form-control" style="border-left: none; border-radius: 0 12px 12px 0;" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-right: none; color: white; border-radius: 12px 0 0 12px;">
                        <i data-feather="lock" style="width: 18px;"></i>
                    </span>
                    <input type="password" id="password" class="form-control" style="border-left: none; border-radius: 0 12px 12px 0;" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">Sign In</button>
        </form>
        
        <div id="errorAlert" class="alert alert-danger mt-4 d-none text-center" role="alert"></div>
    </div>
</div>

<script>
    feather.replace();
    const API_BASE = window.location.origin;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorAlert = document.getElementById("errorAlert");
        
        const btn = e.target.querySelector('button');
        const origText = btn.innerText;
        btn.innerText = "AUTHENTICATING...";
        
        try {
            const res = await fetch(`${API_BASE}/contributor/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem("contributor_id", data.contributor_id);
                // Beautiful transition out
                document.querySelector('.glass-card').style.transform = 'scale(0.95)';
                document.querySelector('.glass-card').style.opacity = '0';
                setTimeout(() => {
                    window.location.href = "/contributor/dashboard-page";
                }, 300);
            } else {
                errorAlert.textContent = data.detail || "Login failed";
                errorAlert.classList.remove("d-none");
                btn.innerText = origText;
            }
        } catch (err) {
            errorAlert.textContent = "An error occurred during login.";
            errorAlert.classList.remove("d-none");
            btn.innerText = origText;
        }
    });
</script>

</body>
</html>
