<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex">

  <!-- Sidebar embedded -->
  <div class="bg-light p-2" style="width:260px; min-height:100vh;">
    <!-- ✅ fixed links -->
    <div class="sidebar-wrapper">
      <h5>Admin Panelss</h5>
      <ul class="list-unstyled">
        <li><a href="/admin-panel/dashboard?tab=students">Student Data</a></li>
        <li><a href="/admin-panel/dashboard?tab=users">User Data</a></li>
        <li><a href="/admin-panel/dashboard?tab=logins">Login Data</a></li>
      </ul>
      <hr>
      <h6>Questions</h6>
      <ul class="list-unstyled">
        <li><a href="/admin-panel/questions/verbal-linguistic">Verbal-Linguistic</a></li>
        <li><a href="/admin-panel/questions/logical-mathematical">Logical-Mathematical</a></li>
        <li><a href="/admin-panel/questions/visual-spatial">Visual-Spatial</a></li>
        <li><a href="/admin-panel/questions/bodily-kinesthetic">Bodily-Kinesthetic</a></li>
        <li><a href="/admin-panel/questions/musical">Musical</a></li>
        <li><a href="/admin-panel/questions/interpersonal">Interpersonal</a></li>
        <li><a href="/admin-panel/questions/intrapersonal">Intrapersonal</a></li>
        <li><a href="/admin-panel/questions/naturalist">Naturalist</a></li>
      </ul>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-grow-1 p-4">
    <h2>Welcomes, <span id="admin-name">Admin</span></h2>
    <hr>
    <div id="data-section">
      <p>Loading...</p>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const token = localStorage.getItem("access_token");

    if (!token) {
      window.location.href = "/admin-panel/login";
    }

    async function loadAdminProfile() {
      try {
        const res = await fetch(`${API_BASE}/admin/get_details`, {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
          localStorage.removeItem("access_token");
          window.location.href = "/admin-panel/login";
          return;
        }
        const data = await res.json();
        document.getElementById("admin-name").innerText = data.username;
      } catch (err) {
        console.error("Error loading profile:", err);
      }
    }

    function displayTable(items, title, columns) {
      let html = `<h3>${title}</h3>`;
      if (items.length === 0) {
        html += "<p>No data available</p>";
      } else {
        html += `<table class="table table-bordered table-striped"><thead><tr>`;
        columns.forEach(col => { html += `<th>${col.label}</th>`; });
        html += `</tr></thead><tbody>`;
        items.forEach(item => {
          html += "<tr>";
          columns.forEach(col => {
            let value = item[col.key] ?? "";
            if (col.key.includes("created_at") || col.key.includes("expiry")) {
              value = new Date(value).toLocaleString();
            }
            if (Array.isArray(value)) {
              value = value.join(", ");
            }
            html += `<td>${value}</td>`;
          });
          html += "</tr>";
        });
        html += "</tbody></table>`;
      }
      document.getElementById("data-section").innerHTML = html;
    }

    async function loadStudents() {
      const res = await fetch(`${API_BASE}/user/students`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.students || [], "Students", [
        { key: "student_id", label: "Student ID" },
        { key: "student_name", label: "Name" },
        { key: "dob", label: "DOB" },
        { key: "student_class", label: "Class" },
        { key: "guardian_name", label: "Guardian" },
        { key: "address", label: "Address" },
        { key: "created_at", label: "Created At" },
        { key: "is_user", label: "Is User" }
      ]);
    }

    async function loadUsers() {
      const res = await fetch(`${API_BASE}/user/users`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.users || [], "Users", [
        { key: "mobile_number", label: "Mobile" },
        { key: "usertype", label: "User Type" },
        { key: "student_ids", label: "Student IDs" },
        { key: "created_at", label: "Created At" }
      ]);
    }

    async function loadLogins() {
      const res = await fetch(`${API_BASE}/user/logins`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      displayTable(data.logins || [], "Logins", [
        { key: "mobile_number", label: "Mobile" },
        { key: "otp", label: "OTP" },
        { key: "usertype", label: "User Type" },
        { key: "created_at", label: "Created At" },
        { key: "expiry", label: "Expiry" }
      ]);
    }

    function loadTabContent() {
      const params = new URLSearchParams(window.location.search);
      const tabRaw = params.get("tab")||"students";
      const tab = tabRaw.trim().toLowerCase();
      console.log("DEBUG: Tab detected =", tab);
      switch (tab) {
        case "students":
          loadStudents();
          break;
        case "users":
          loadUsers();
          break;
        case "logins":
          loadLogins();
          break;
        default:
          console.warn("Unknown tab:", tab, "falling back to studenrts");
          loadStudents();
      }
    }
    loadAdminProfile();
    loadTabContent();
  </script>

</body>
</html>
