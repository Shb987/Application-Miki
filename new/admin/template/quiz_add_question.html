<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/assets/images/favicon.png" type="image/x-icon">

    <!-- Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/assets/css/font-awesome.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/icofont.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/themify.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/feather-icon.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/scrollbar.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
    <link id="color" rel="stylesheet" href="/assets/css/color-1.css" media="screen">
    <link rel="stylesheet" type="text/css" href="/assets/css/responsive.css">
</head>

<body>
    <!-- loader starts-->
    <div class="loader-wrapper">
        <div class="loader">
            <div class="loader4"></div>
        </div>
    </div>
    <!-- loader ends-->
    <!-- tap on top starts-->
    <div class="tap-top"><i data-feather="chevrons-up"></i></div>
    <!-- tap on tap ends-->
    <!-- page-wrapper Start-->
    <div class="page-wrapper compact-wrapper" id="pageWrapper">
        <!-- Page Header Start-->
        <div class="page-header">
            <div class="header-wrapper row m-0">
                <div class="header-logo-wrapper col-auto p-0">
                    <div class="logo-wrapper"> <a href="/admin-panel/dashboard"><img class="img-fluid for-light"
                                src="/assets/images/logo/logo_dark.png" alt="logo-light"><img class="img-fluid for-dark"
                                src="/assets/images/logo/logo.png" alt="logo-dark"></a></div>
                    <div class="toggle-sidebar"> <i class="status_toggle middle sidebar-toggle"
                            data-feather="align-center"></i></div>
                </div>
                <div class="left-header col-xxl-5 col-xl-6 col-lg-5 col-md-4 col-sm-3 p-0">
                    <div> <a class="toggle-sidebar" href="#"> <i class="iconly-Category icli"> </i></a>
                        <div class="d-flex align-items-center gap-2 ">
                            <h4 class="f-w-600">Add Quiz Question</h4>
                        </div>
                    </div>
                </div>
                <div class="nav-right col-xxl-7 col-xl-6 col-md-7 col-8 pull-right right-header p-0 ms-auto">
                    <ul class="nav-menus">
                        <li class="profile-nav onhover-dropdown">
                            <div class="media profile-media"><img class="b-r-10"
                                    src="/assets/images/dashboard/profile.png" alt="">
                                <div class="media-body d-xxl-block d-none box-col-none">
                                    <div class="d-flex align-items-center gap-2"> <span id="admin-name">Admin</span><i
                                            class="middle fa fa-angle-down"> </i></div>
                                    <p class="mb-0 font-roboto">Admin</p>
                                </div>
                            </div>
                            <ul class="profile-dropdown onhover-show-div">
                                <li><a href="#" onclick="logout()"><i data-feather="log-out"></i><span>Log
                                            Out</span></a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Page Header Ends-->
        <!-- Page Body Start-->
        <div class="page-body-wrapper">
            <!-- Page Sidebar Start-->
            {% include "sidebar.html" %}
            <!-- Page Sidebar Ends-->
            <div class="page-body">
                <div class="container-fluid">
                    <div class="page-title">
                        <div class="row">
                            <div class="col-6">
                                <h4>Add Question</h4>
                            </div>
                            <div class="col-6">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="/admin-panel/dashboard">
                                            <svg class="stroke-icon">
                                                <use href="/assets/svg/icon-sprite.svg#stroke-home"></use>
                                            </svg></a></li>
                                    <li class="breadcrumb-item">Quiz Module</li>
                                    <li class="breadcrumb-item active">Add Question</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Container-fluid starts-->
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card">
                                <div class="card-header pb-0">
                                    <h5>Question Details</h5>
                                </div>
                                <div class="card-body">
                                    <form id="questionForm">
                                        <div class="row g-3">
                                            <!-- Domain -->
                                            <div class="col-md-6">
                                                <label class="form-label">Domain <span
                                                        class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="domain" required
                                                    placeholder="e.g., General Knowledge, Science, IQ & Reasoning">
                                            </div>

                                            <!-- Question Type -->
                                            <div class="col-md-6">
                                                <label class="form-label">Question Type <span
                                                        class="text-danger">*</span></label>
                                                <select class="form-select" id="questionType" required
                                                    onchange="toggleOptions()">
                                                    <option value="">Select Type</option>
                                                    <option value="MCQ">MCQ (Multiple Choice)</option>
                                                    <option value="TrueFalse">True/False</option>
                                                    <option value="FillInBlank">Fill in the Blank</option>
                                                    <option value="PatternRecognition">Pattern Recognition</option>
                                                    <option value="LogicalReasoning">Logical Reasoning</option>
                                                    <option value="Analogy">Analogy</option>
                                                    <option value="Puzzle">Puzzle</option>
                                                    <option value="SentenceCorrection">Sentence Correction</option>
                                                    <option value="ErrorSpotting">Error Spotting</option>
                                                    <option value="Vocabulary">Vocabulary</option>
                                                    <option value="PartsOfSpeech">Parts of Speech</option>
                                                </select>
                                            </div>

                                            <!-- Question Text -->
                                            <div class="col-12">
                                                <label class="form-label">Question Text <span
                                                        class="text-danger">*</span></label>
                                                <textarea class="form-control" id="questionText" rows="3" required
                                                    placeholder="Enter your question here"></textarea>
                                            </div>

                                            <!-- Options (for MCQ, Analogy, etc.) -->
                                            <div class="col-12" id="optionsSection" style="display: none;">
                                                <label class="form-label">Options <span
                                                        class="text-danger">*</span></label>
                                                <div id="optionsList">
                                                    <div class="input-group mb-2">
                                                        <input type="text" class="form-control option-input"
                                                            placeholder="Option 1">
                                                        <button class="btn btn-outline-danger" type="button"
                                                            onclick="removeOption(this)"><i
                                                                data-feather="x"></i></button>
                                                    </div>
                                                    <div class="input-group mb-2">
                                                        <input type="text" class="form-control option-input"
                                                            placeholder="Option 2">
                                                        <button class="btn btn-outline-danger" type="button"
                                                            onclick="removeOption(this)"><i
                                                                data-feather="x"></i></button>
                                                    </div>
                                                </div>
                                                <button type="button" class="btn btn-sm btn-secondary"
                                                    onclick="addOption()"><i data-feather="plus"></i> Add
                                                    Option</button>
                                            </div>

                                            <!-- Correct Answer -->
                                            <div class="col-md-6">
                                                <label class="form-label">Correct Answer <span
                                                        class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="correctAnswer" required
                                                    placeholder="Enter the correct answer">
                                            </div>

                                            <!-- Marks -->
                                            <div class="col-md-6">
                                                <label class="form-label">Marks <span
                                                        class="text-danger">*</span></label>
                                                <input type="number" class="form-control" id="marks" value="1" min="1"
                                                    required>
                                            </div>

                                            <!-- Class Range -->
                                            <div class="col-md-4">
                                                <label class="form-label">Class Range <span
                                                        class="text-danger">*</span></label>
                                                <select class="form-select" id="classRange" required>
                                                    <option value="">Select Class</option>
                                                    <option value="1-3">1-3 (Primary Lower)</option>
                                                    <option value="3-5">3-5 (Primary Upper)</option>
                                                    <option value="6-8">6-8 (Middle School)</option>
                                                    <option value="9-10">9-10 (High School)</option>
                                                    <option value="11-12">11-12 (Higher Secondary)</option>
                                                </select>
                                            </div>

                                            <!-- Difficulty Level -->
                                            <div class="col-md-4">
                                                <label class="form-label">Difficulty Level <span
                                                        class="text-danger">*</span></label>
                                                <select class="form-select" id="difficultyLevel" required>
                                                    <option value="">Select Difficulty</option>
                                                    <option value="Easy">Easy</option>
                                                    <option value="Medium">Medium</option>
                                                    <option value="Hard">Hard</option>
                                                </select>
                                            </div>

                                            <!-- Status -->
                                            <div class="col-md-4">
                                                <label class="form-label">Status</label>
                                                <select class="form-select" id="isActive">
                                                    <option value="true">Active</option>
                                                    <option value="false">Inactive</option>
                                                </select>
                                            </div>

                                            <!-- Explanation -->
                                            <div class="col-12">
                                                <label class="form-label">Explanation (Optional)</label>
                                                <textarea class="form-control" id="explanation" rows="2"
                                                    placeholder="Provide an explanation for the answer"></textarea>
                                            </div>

                                            <!-- Hints -->
                                            <div class="col-12">
                                                <label class="form-label">Hints (Optional)</label>
                                                <textarea class="form-control" id="hints" rows="2"
                                                    placeholder="Provide hints for students"></textarea>
                                            </div>

                                            <!-- Buttons -->
                                            <div class="col-12">
                                                <button type="submit" class="btn btn-primary"><i
                                                        data-feather="save"></i> Save Question</button>
                                                <a href="/admin-panel/quiz/questions-page" class="btn btn-secondary"><i
                                                        data-feather="x"></i> Cancel</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Container-fluid Ends-->
            </div>
            <!-- footer start-->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12 footer-copyright text-center">
                            <p class="mb-0">Copyright 2024 © Quiz Management System</p>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/icons/feather-icon/feather.min.js"></script>
    <script src="/assets/js/icons/feather-icon/feather-icon.js"></script>
    <script src="/assets/js/scrollbar/simplebar.js"></script>
    <script src="/assets/js/scrollbar/custom.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/sidebar-menu.js"></script>
    <script src="/assets/js/sidebar-pin.js"></script>
    <script src="/assets/js/script.js"></script>

    <script>
        const token = localStorage.getItem("admin_token");
        const API_BASE = "http://13.200.236.155:8000";

        if (!token) {
            window.location.replace("/admin-panel/login");
        }

        // Toggle options section based on question type
        function toggleOptions() {
            const questionType = document.getElementById("questionType").value;
            const optionsSection = document.getElementById("optionsSection");

            const typesWithOptions = ['MCQ', 'Analogy', 'PatternRecognition', 'LogicalReasoning',
                'Puzzle', 'SentenceCorrection', 'ErrorSpotting', 'Vocabulary', 'PartsOfSpeech'];

            if (typesWithOptions.includes(questionType)) {
                optionsSection.style.display = 'block';
            } else {
                optionsSection.style.display = 'none';
            }
        }

        // Add new option input
        function addOption() {
            const optionsList = document.getElementById("optionsList");
            const optionCount = optionsList.children.length + 1;

            const div = document.createElement('div');
            div.className = 'input-group mb-2';
            div.innerHTML = `
          <input type="text" class="form-control option-input" placeholder="Option ${optionCount}">
          <button class="btn btn-outline-danger" type="button" onclick="removeOption(this)"><i data-feather="x"></i></button>
        `;

            optionsList.appendChild(div);
            feather.replace();
        }

        // Remove option input
        function removeOption(button) {
            const optionsList = document.getElementById("optionsList");
            if (optionsList.children.length > 2) {
                button.parentElement.remove();
            } else {
                alert("At least 2 options are required");
            }
        }

        // Handle form submission
        document.getElementById("questionForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            // Collect form data
            const questionType = document.getElementById("questionType").value;
            const optionsSection = document.getElementById("optionsSection");

            let options = null;
            if (optionsSection.style.display !== 'none') {
                options = Array.from(document.querySelectorAll(".option-input"))
                    .map(input => input.value.trim())
                    .filter(val => val !== '');

                if (options.length < 2) {
                    alert("Please provide at least 2 options");
                    return;
                }
            }

            const questionData = {
                domain: document.getElementById("domain").value.trim(),
                question_text: document.getElementById("questionText").value.trim(),
                question_type: questionType,
                options: options,
                correct_answer: document.getElementById("correctAnswer").value.trim(),
                difficulty_level: document.getElementById("difficultyLevel").value,
                class_range: document.getElementById("classRange").value,
                marks: parseInt(document.getElementById("marks").value),
                explanation: document.getElementById("explanation").value.trim() || null,
                hints: document.getElementById("hints").value.trim() || null,
                is_active: document.getElementById("isActive").value === "true"
            };

            try {
                const res = await fetch(`${API_BASE}/admin-panel/quiz/add-question`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(questionData)
                });

                const result = await res.json();

                if (res.ok) {
                    alert("Question added successfully!");
                    window.location.href = "/admin-panel/quiz/questions-page";
                } else {
                    alert("Error: " + (result.detail || "Failed to add question"));
                }
            } catch (err) {
                console.error("Error adding question:", err);
                alert("Error adding question. Please try again.");
            }
        });

        function logout() {
            localStorage.removeItem("admin_token");
            window.location.replace("/admin-panel/login");
        }
    </script>
</body>

</html>
