    <div class="back-btn"><i class="fa fa-angle-left"></i></div>
    <div class="toggle-sidebar">
      <i class="status_toggle middle sidebar-toggle" data-feather="grid"></i>

  </div>
  <div class="logo-icon-wrapper">
    <a href="/admin-panel/dashboard">
      <img class="img-fluid" src="/assets/images/logo/logo-icon.png" alt="logo-icon">

  </div>
  <nav class="sidebar-main">

      <ul class="sidebar-links" id="simple-bar">
        <li class="sidebar-main-title">
          <div><h6>GENERAL</h6></div>
        </li>
        <!-- ✅ Dashboard -->
        <li class="sidebar-list" id="menu-dashboard">
          <a class="sidebar-link sidebar-title" href="#">
            <svg class="stroke-icon">
              <use xlink:href="/assets/svg/icon-sprite.svg#stroke-home"></use>
            </svg>
            <svg class="fill-icon">
              <use xlink:href="/assets/svg/icon-sprite.svg#fill-home"></use>
            </svg>
            <span>Dashboard</span>

          <ul class="sidebar-submenu">
            <li><a href="/admin-panel/dashboard?tab=students">Student Data</a></li>

        <!-- ✅ Questions -->
        <li class="sidebar-list" id="menu-questions">
          <a class="sidebar-link sidebar-title" href="#">
            <svg class="stroke-icon">
              <use xlink:href="/assets/svg/icon-sprite.svg#stroke-widget"></use>

            <svg class="fill-icon">
              <use xlink:href="/assets/svg/icon-sprite.svg#fill-widget"></use>

      </ul>
    </div>
  </nav>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentUrl = window.location.href;
    document.querySelectorAll(".sidebar-submenu a").forEach(link => {
      if (currentUrl.includes(link.getAttribute("href"))) {
        link.classList.add("active");
        const parentMenu = link.closest(".sidebar-list");
        if (parentMenu) {
          parentMenu.classList.add("active");
          const submenu = parentMenu.querySelector(".sidebar-submenu");
          submenu.classList.add("menu-open");
          submenu.style.display = "block";
        }
      }
    });
  });
</script>
